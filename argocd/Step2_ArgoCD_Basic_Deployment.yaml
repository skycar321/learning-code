# ArgoCD 기본 배포 YAML 예시
# 이 파일은 ArgoCD 학습 계획의 2단계인 'ArgoCD 설치 및 초기 설정'을 위한
# 개념적인 Kubernetes 매니페스트 예시입니다.
# 실제 ArgoCD 설치 시 사용되는 공식 install.yaml 파일의 일부를 간략화한 형태입니다.
# ArgoCD의 주요 컴포넌트들이 어떻게 Kubernetes 리소스(Deployment, Service 등)로
# 정의되는지 이해하는 데 도움을 줍니다.

# -----------------------------------------------------------------------------
# 1. 네임스페이스 (Namespace)
# -----------------------------------------------------------------------------
# ArgoCD 컨트롤 플레인이 배포될 Kubernetes 네임스페이스를 정의합니다.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: argocd

---

# -----------------------------------------------------------------------------
# 2. ArgoCD API 서버 (argocd-server) Deployment 및 Service
# -----------------------------------------------------------------------------
# ArgoCD UI, CLI, API 요청을 처리하는 서버 컴포넌트입니다.
# 사용자 인증 및 Git 리포지토리, 클러스터 정보 조회 등을 담당합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
    spec:
      containers:
      - name: argocd-server
        image: quay.io/argoproj/argocd:v2.10.0 # ArgoCD 이미지 버전 (최신 버전 사용 권장)
        ports:
        - containerPort: 8080 # HTTP/gRPC
        - containerPort: 8443 # HTTPS
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        env:
        - name: ARGOCD_SERVER_INSECURE
          value: "true" # 테스트 환경에서 HTTPS 인증서 없이 사용하도록 설정 (프로덕션에서는 비활성화 권장)
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP # 외부 접근을 위한 LoadBalancer나 NodePort로 변경 가능
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: https
    protocol: TCP
    port: 443
    targetPort: 8443

---

# -----------------------------------------------------------------------------
# 3. ArgoCD Application Controller (argocd-application-controller) Deployment
# -----------------------------------------------------------------------------
# Git 리포지토리와 Kubernetes 클러스터의 상태를 지속적으로 동기화하는 핵심 컴포넌트입니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-application-controller
    spec:
      containers:
      - name: argocd-application-controller
        image: quay.io/argoproj/argocd:v2.10.0 # ArgoCD 이미지 버전
        command: ["argocd-application-controller"]
        args: ["--argocd-rbac-cm-name=argocd-rbac-cm"]
        # 필요한 RBAC 권한은 ServiceAccount 및 RoleBinding으로 정의됩니다.
        # 여기서는 배포 자체의 스펙만 보여줍니다.

---

# -----------------------------------------------------------------------------
# 4. ArgoCD Repo Server (argocd-repo-server) Deployment 및 Service
# -----------------------------------------------------------------------------
# Git 리포지토리의 매니페스트를 캐싱하고 렌더링하는 역할을 합니다.
# Helm, Kustomize 등의 템플릿 엔진을 처리합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-repo-server
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-repo-server
    spec:
      containers:
      - name: argocd-repo-server
        image: quay.io/argoproj/argocd:v2.10.0 # ArgoCD 이미지 버전
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-repo-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-repo-server
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-repo-server
  ports:
  - name: tcp-repo-server
    protocol: TCP
    port: 8081
    targetPort: 8081

---

# -----------------------------------------------------------------------------
# 5. ArgoCD Redis (argocd-redis) Deployment 및 Service
# -----------------------------------------------------------------------------
# ArgoCD 컴포넌트 간의 캐싱 및 세션 관리를 위한 Redis 인스턴스입니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-redis
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-redis
    spec:
      containers:
      - name: redis
        image: redis:7.0.12-alpine # Redis 이미지 버전
        ports:
        - containerPort: 6379
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-redis
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-redis
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argocd-redis
  ports:
  - name: tcp-redis
    protocol: TCP
    port: 6379
    targetPort: 6379
