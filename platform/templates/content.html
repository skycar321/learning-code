{% extends "base.html" %}

{% block content %}
<!-- Breadcrumb / Header Area -->
<div class="bg-white border-b border-slate-100 sticky top-0 z-10 backdrop-blur-md bg-white/90 px-8 py-6 mb-8">
    <nav class="flex items-center gap-2 text-sm text-slate-400 mb-3">
        <a href="/" class="hover:text-brand-600 transition-colors">Home</a>
        <svg class="w-3 h-3 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
        <span class="text-slate-600 font-medium">{{ current_category }}</span>
        <svg class="w-3 h-3 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
        <span class="text-brand-600 font-medium bg-brand-50 px-2 py-0.5 rounded-md border border-brand-100">{{ subcategory }}</span>
    </nav>
    <h1 class="text-3xl font-bold text-slate-900 tracking-tight">{{ title }}</h1>
</div>

<!-- Content Area -->
<div class="px-8 pb-20">
    <article class="prose prose-slate prose-lg max-w-none 
        prose-headings:font-semibold prose-headings:tracking-tight prose-headings:text-slate-900
        prose-h1:text-2xl
        prose-p:text-slate-600 prose-p:leading-7
        prose-a:text-brand-600 prose-a:no-underline prose-a:font-medium hover:prose-a:text-brand-700 hover:prose-a:underline
        prose-strong:text-slate-900 prose-strong:font-semibold
        prose-code:text-brand-600 prose-code:bg-brand-50 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded-md prose-code:font-medium prose-code:before:content-none prose-code:after:content-none
        prose-pre:bg-[#282c34] prose-pre:shadow-lg prose-pre:rounded-xl prose-pre:border prose-pre:border-slate-800
        prose-img:rounded-xl prose-img:shadow-md
        prose-blockquote:border-l-brand-500 prose-blockquote:bg-slate-50 prose-blockquote:py-1 prose-blockquote:px-4 prose-blockquote:rounded-r-lg prose-blockquote:not-italic prose-blockquote:text-slate-600
        ">
        {{ html_content|safe }}
    </article>
</div>

<!-- Re-trigger highlighting for dynamic content -->
<script>
    hljs.highlightAll();
</script>
{% endblock %}
