<!-- webpack/Step1_WebpackBasics/src/index.html -->
<!--
  Webpack 학습 계획 - 1단계: Webpack 기본 개념 및 시작
  이 파일은 Webpack의 `HtmlWebpackPlugin`에 의해 템플릿으로 사용되는 HTML 파일입니다.
  `HtmlWebpackPlugin`은 이 템플릿을 기반으로 최종 번들된 JavaScript 파일을
  자동으로 삽입하여 새로운 HTML 파일을 생성합니다.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title> <!-- HtmlWebpackPlugin에서 설정한 title 사용 -->
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f4f4f4;
      }
      .hello {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .hello button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      .hello button:hover {
        background-color: #0056b3;
      }
    </style>
</head>
<body>
    <!-- Webpack 번들된 JavaScript 파일은 HtmlWebpackPlugin에 의해 자동으로 여기에 삽입됩니다. -->
</body>
</html>
