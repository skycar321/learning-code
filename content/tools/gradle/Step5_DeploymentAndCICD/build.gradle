// gradle/Step5_DeploymentAndCICD/build.gradle
// Gradle 배포 및 CI/CD 연동 학습을 위한 build.gradle 파일 예시입니다.
// 이 파일은 Gradle을 사용하여 빌드된 아티팩트(JAR, WAR 등)를 아티팩트 저장소(Nexus, Artifactory 등)에 배포하고,
// CI/CD(Continuous Integration/Continuous Delivery) 파이프라인과 연동하는 개념을 다룹니다.
//
// 자동화된 빌드 및 배포 파이프라인은 소프트웨어 개발 프로세스의 효율성을 크게 향상시킵니다.

plugins {
    id 'java'         // Java 프로젝트 빌드 기능
    id 'maven-publish' // Maven 저장소에 아티팩트를 게시하는 기능 제공
    id 'signing'       // 아티팩트 서명 (선택 사항, 보안 강화)
    id 'application'   // 실행 가능한 JAR 생성 (선택 사항)
}

group 'com.example.gradle.deploy'
version '1.0.0' // 배포 가능한 아티팩트이므로 안정적인 버전 번호 사용

repositories {
    mavenCentral()
}

dependencies {
    // 라이브러리 의존성 추가
    implementation 'com.google.guava:guava:32.1.3-jre'

    // 테스트 의존성
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar() // 소스 JAR 파일 생성
    withJavadocJar() // Javadoc JAR 파일 생성
}

application {
    mainClass = 'com.example.gradle.deploy.App'
}

test {
    useJUnitPlatform()
}

// -----------------------------------------------------------------------------
// 학습 포인트 1: 아티팩트 생성 및 배포 (Creating & Deploying Artifacts)
// - `maven-publish` 플러그인을 사용하여 빌드된 JAR 파일을 Maven 저장소에 게시합니다.
// - `publishing` 블록에서 게시할 아티팩트 및 저장소 정보를 설정합니다.
// - `publications`: 게시할 아티팩트(MavenPublication)를 정의합니다.
// - `repositories`: 아티팩트를 배포할 원격 저장소의 URL 및 인증 정보를 설정합니다.
// -----------------------------------------------------------------------------
publishing {
    publications {
        mavenJava(MavenPublication) { // 'mavenJava'라는 이름의 MavenPublication 정의
            from components.java // 'java' 컴포넌트(JAR, Javadoc, Sources)를 게시

            // 생성될 POM 파일에 프로젝트 정보를 추가 (선택 사항)
            pom {
                name = 'My Deployment App'
                description = 'A sample application for Gradle deployment learning.'
                url = 'http://www.example.com/project'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'your_id'
                        name = 'Your Name'
                        email = 'your.email@example.com'
                    }
                }
                scm {
                    connection = 'scm:git:git@github.com:your-org/your-repo.git'
                    developerConnection = 'scm:git:ssh://github.com:your-org/your-repo.git'
                    url = 'http://github.com/your-org/your-repo'
                }
            }
        }
    }
    repositories {
        // 나쁜 예시: 인증 정보 (username, password)를 build.gradle 파일에 하드코딩하는 것.
        // - 보안에 매우 취약하며, Git 리포지토리에 민감 정보가 노출됩니다.
        // - 환경 변수나 `gradle.properties` (로컬) 또는 CI/CD 파이프라인의 Secret 기능을 사용해야 합니다.

        // `maven` 블록: 원격 Maven 저장소 (예: Nexus, Artifactory, Maven Central)
        maven {
            name = "MyRemoteRepository"
            url = uri("http://localhost:8081/repository/maven-releases/") // 예시: Nexus Release Repository URL
            // `url = uri("http://localhost:8081/repository/maven-snapshots/")` // 스냅샷용 URL

            credentials {
                // 환경 변수에서 사용자 이름과 비밀번호를 가져옴 (안전한 방법)
                username = System.getenv("NEXUS_USERNAME") ?: project.properties['nexusUsername']
                password = System.getenv("NEXUS_PASSWORD") ?: project.properties['nexusPassword']
                // `project.properties`는 `gradle.properties` 파일에서 로드됩니다.
            }
        }
    }
}

// -----------------------------------------------------------------------------
// 학습 포인트 2: 아티팩트 서명 (Signing)
// - `signing` 플러그인을 사용하여 게시되는 아티팩트에 GPG 서명을 추가할 수 있습니다.
// - 이는 아티팩트의 무결성과 출처를 보장하는 데 사용됩니다.
// - `signing.keyId`, `signing.password`, `signing.secretKeyRingFile` 설정.
// - `sign publishing.publications.mavenJava`와 같이 publication을 서명합니다.
// -----------------------------------------------------------------------------
// signing {
//     sign publishing.publications.mavenJava
//     // signing.keyId = '' // GPG 키 ID
//     // signing.password = '' // GPG 키 비밀번호
//     // signing.secretKeyRingFile = '' // 비밀 키 링 파일 경로 (보안상 외부 관리 권장)
// }

// -----------------------------------------------------------------------------
// 학습 포인트 3: CI/CD 도구와 Gradle 연동 (개념)
// - Jenkins, GitLab CI, GitHub Actions 등 CI/CD 도구에서 Gradle 명령어를 실행하여
//   자동화된 빌드, 테스트, 배포 파이프라인을 구축합니다.
// - `gradlew build`: 소스 변경 시 빌드 및 테스트 자동 실행.
// - `gradlew publish`: 빌드 성공 시 아티팩트 저장소에 배포.
// - `gradlew :subproject:publish`: 멀티 프로젝트에서 특정 서브 프로젝트만 배포.
// -----------------------------------------------------------------------------
task ciBuild(type: GradleBuild) {
    description = 'CI/CD 파이프라인에서 빌드 및 테스트를 수행하는 태스크'
    tasks = ['clean', 'build', 'test'] // `clean`, `build`, `test` 태스크를 순서대로 실행
    // 나쁜 예시: CI/CD 환경에서 필요한 태스크만 실행하는 대신 모든 태스크를 실행하여
    // - 불필요한 시간 낭비나 리소스 소모를 유발하는 것.
    // 좋은 예시: CI/CD 단계별로 필요한 최소한의 태스크만 실행하여 파이프라인을 최적화하는 것.
}

task ciPublish(type: GradleBuild) {
    description = 'CI/CD 파이프라인에서 아티팩트를 게시하는 태스크'
    tasks = ['publish'] // `publish` 태스크 실행 (maven-publish 플러그인에 의해 제공됨)
    // dependsOn ciBuild // ciBuild 태스크가 먼저 실행되도록 의존성 설정 (파이프라인에서 제어 가능)
}

// -----------------------------------------------------------------------------
// 학습 포인트 4: Gradle Daemon (개념)
// - Gradle Daemon은 백그라운드에서 실행되는 프로세스로, 빌드 시작 시간을 단축시켜줍니다.
// - 첫 빌드 이후부터는 JVM을 재사용하여 효율적인 빌드를 가능하게 합니다.
// - `.gradle/gradle.properties` 파일에 `org.gradle.daemon=true`로 설정하거나
//   `gradlew --daemon` 명령어를 통해 명시적으로 활성화할 수 있습니다.
// -----------------------------------------------------------------------------

