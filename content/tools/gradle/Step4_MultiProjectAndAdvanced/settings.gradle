// gradle/Step4_MultiProjectAndAdvanced/settings.gradle
// Gradle 멀티 프로젝트 빌드 학습을 위한 settings.gradle 파일 예시입니다.
// 이 파일은 빌드에 포함될 서브 프로젝트들을 선언하여 전체 프로젝트 구조를 정의합니다.
//
// 멀티 프로젝트 빌드는 대규모 애플리케이션이나 모듈화된 시스템을 개발할 때 매우 유용합니다.
// 각 모듈(서브 프로젝트)은 독립적으로 빌드되거나 다른 모듈에 의존할 수 있습니다.

// -----------------------------------------------------------------------------
// 학습 포인트 1: `rootProject.name`
// - 전체 멀티 프로젝트 빌드의 루트 프로젝트 이름을 정의합니다.
// -----------------------------------------------------------------------------
rootProject.name = 'multi-project-example' // 루트 프로젝트 이름 정의

// -----------------------------------------------------------------------------
// 학습 포인트 2: `include` 키워드를 이용한 서브 프로젝트 선언
// - `include 'app'`, `include 'library'` 와 같이 서브 프로젝트의 이름을 지정합니다.
// - Gradle은 지정된 이름과 동일한 이름의 디렉토리를 찾아 서브 프로젝트로 인식합니다.
// - 각 서브 프로젝트 디렉토리에는 자체 `build.gradle` 파일이 있어야 합니다.
// -----------------------------------------------------------------------------
include 'app' // 'app'이라는 이름의 서브 프로젝트 포함
include 'library' // 'library'라는 이름의 서브 프로젝트 포함

// 나쁜 예시: 멀티 프로젝트인데 `settings.gradle`을 누락하거나, 서브 프로젝트를 `include`하지 않는 것.
// - Gradle이 프로젝트 구조를 파악하지 못해 빌드 시 오류가 발생합니다.
// - 또는 의도치 않게 단일 프로젝트로 빌드되어 서브 프로젝트 간의 의존성 해결이 불가능해집니다.

// 좋은 예시: 모든 서브 프로젝트를 `settings.gradle`에 명확하게 선언하여
// - Gradle이 올바른 빌드 그래프를 구성하고, 서브 프로젝트 간의 의존성을 해결할 수 있도록 합니다.

// -----------------------------------------------------------------------------
// 개념: 서브 프로젝트의 경로 변경 (선택 사항)
// - `project(':some-subproject').projectDir = file('some-other-directory')`
// - 서브 프로젝트의 디렉토리 이름이 프로젝트 이름과 다른 경우 사용합니다.
// - 일반적으로는 서브 프로젝트 이름과 디렉토리 이름을 일치시키는 것이 좋습니다.
// -----------------------------------------------------------------------------
