// gradle/Step4_MultiProjectAndAdvanced/app/build.gradle
// Gradle 멀티 프로젝트 빌드 학습을 위한 'app' 서브 프로젝트의 build.gradle 파일 예시입니다.
// 'app' 프로젝트는 실행 가능한 애플리케이션이며, 'library' 프로젝트에 의존합니다.
//
// 서브 프로젝트의 `build.gradle` 파일은 루트 프로젝트의 공통 설정을 상속받으면서도,
// 해당 서브 프로젝트만의 고유한 설정이나 의존성을 정의할 수 있습니다.

// -----------------------------------------------------------------------------
// 학습 포인트 1: `application` 플러그인 적용
// - 이 프로젝트가 실행 가능한 애플리케이션임을 명시하고, `run` 및 배포 관련 태스크를 제공합니다.
// -----------------------------------------------------------------------------
plugins {
    id 'application' // `application` 플러그인 적용
    // 루트 build.gradle에서 `apply plugin: 'java'`를 했으므로 여기에 다시 명시할 필요 없음.
}

// -----------------------------------------------------------------------------
// 학습 포인트 2: `mainClass` 설정
// - `application` 플러그인에 의해 생성되는 `run` 태스크와 실행 가능한 JAR 파일을 위해
//   애플리케이션의 메인 클래스를 지정합니다.
// -----------------------------------------------------------------------------
application {
    mainClass = 'com.example.app.App' // 'app' 프로젝트의 메인 클래스 지정
}

// -----------------------------------------------------------------------------
// 학습 포인트 3: 서브 프로젝트 간 의존성 관리
// - `implementation project(':library')`: 'app' 프로젝트가 'library' 프로젝트에 의존함을 선언합니다.
// - 이를 통해 'app' 프로젝트에서 'library' 프로젝트의 클래스나 리소스를 사용할 수 있습니다.
// -----------------------------------------------------------------------------
dependencies {
    // 'library' 서브 프로젝트에 대한 의존성 선언
    implementation project(':library') // 'library' 프로젝트의 빌드 결과를 의존성으로 추가
    // 나쁜 예시: 서브 프로젝트 간의 의존성을 일반적인 외부 라이브러리처럼 선언하는 것.
    // - `implementation 'com.example.multi-project:library:1.0-SNAPSHOT'` (X)
    // - 이렇게 하면 Gradle이 로컬 프로젝트를 참조하지 않고 원격 저장소에서 라이브러리를 찾으려 할 것입니다.
    // - `project(':프로젝트명')` 문법을 사용하여 로컬 서브 프로젝트를 정확히 참조해야 합니다.

    // 추가적인 외부 라이브러리 의존성 (이 프로젝트에만 해당)
    implementation 'com.google.guava:guava:32.1.3-jre'
}

// -----------------------------------------------------------------------------
// 기타: 루트 build.gradle에서 상속받은 설정
// - `group`, `version`
// - `repositories`
// - `java` (toolchain 포함)
// - `test` (JUnit 플랫폼 포함)
// -----------------------------------------------------------------------------

/*
이 `build.gradle` 파일은 루트 프로젝트의 `settings.gradle`, `build.gradle` 및
'library' 서브 프로젝트의 `build.gradle` 파일과 함께 사용됩니다.
(자세한 내용은 README.md 참조)
*/
