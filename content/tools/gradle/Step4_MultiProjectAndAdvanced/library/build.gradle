// gradle/Step4_MultiProjectAndAdvanced/library/build.gradle
// Gradle 멀티 프로젝트 빌드 학습을 위한 'library' 서브 프로젝트의 build.gradle 파일 예시입니다.
// 'library' 프로젝트는 다른 프로젝트(예: 'app')에서 재사용될 수 있는 라이브러리를 빌드합니다.
//
// 서브 프로젝트는 자신만의 고유한 의존성, 태스크, 플러그인 설정을 가질 수 있습니다.

// -----------------------------------------------------------------------------
// 학습 포인트 1: `java-library` 플러그인 적용
// - `java` 플러그인 대신 `java-library` 플러그인을 적용합니다.
// - `api` 및 `implementation` 의존성 구성이 가능해지며, 이 라이브러리를 사용하는
//   다른 프로젝트에 의존성이 전이되는 방식을 더 세밀하게 제어할 수 있습니다.
// -----------------------------------------------------------------------------
plugins {
    id 'java-library' // 'java' 대신 'java-library' 플러그인 적용
}

// -----------------------------------------------------------------------------
// 학습 포인트 2: 라이브러리 고유 의존성
// - 이 라이브러리만 사용하는 외부 의존성을 여기에 선언합니다.
// - `api`로 선언된 의존성은 이 라이브러리를 사용하는 다른 프로젝트에도 전이됩니다.
// - `implementation`으로 선언된 의존성은 이 라이브러리 내부에서만 사용되고,
//   다른 프로젝트로 전이되지 않습니다.
// -----------------------------------------------------------------------------
dependencies {
    // 이 라이브러리 내부에서만 사용되는 의존성
    implementation 'org.apache.commons:commons-lang3:3.12.0' // Apache Commons Lang 예시

    // api 'com.google.guava:guava:32.1.3-jre' // 이 라이브러리를 사용하는 모든 프로젝트에 Guava가 전이됨
}

// -----------------------------------------------------------------------------
// 기타: 루트 build.gradle에서 상속받은 설정
// - `group`, `version`
// - `repositories`
// - `java` (toolchain 포함)
// - `test` (JUnit 플랫폼 포함)
// -----------------------------------------------------------------------------

/*
이 `build.gradle` 파일은 루트 프로젝트의 `settings.gradle`, `build.gradle` 및
'app' 서브 프로젝트의 `build.gradle` 파일과 함께 사용됩니다.
(자세한 내용은 README.md 참조)
*/
