// gradle/Step3_DependencyManagementAndPlugins/build.gradle
// Gradle 의존성 관리 및 플러그인 학습을 위한 build.gradle 파일 예시입니다.
// 이 파일은 프로젝트의 의존성을 선언하고 관리하는 다양한 방법과
// Gradle 플러그인(Java, Application 등)을 적용하여 빌드 기능을 확장하는 방법을 보여줍니다.
//
// 의존성 관리는 프로젝트가 사용하는 외부 라이브러리(JAR 파일)를 효율적으로 가져오고
// 빌드 스코프에 맞게 포함시키는 Gradle 빌드의 핵심 기능입니다.

// -----------------------------------------------------------------------------
// 학습 포인트 1: `plugins` 블록 (플러그인 선언)
// - `id 'java'`: Java 프로젝트 빌드 기능 제공.
// - `id 'application'`: 실행 가능한 애플리케이션을 빌드하고 실행하는 태스크 제공.
// - `id 'org.springframework.boot' version '2.7.5'`: Spring Boot 프로젝트를 위한 플러그인.
// -----------------------------------------------------------------------------
plugins {
    id 'java' // Java 프로젝트 빌드를 위한 기본 기능 제공
    id 'application' // 실행 가능한 JAR 파일 생성 및 실행 태스크 제공
    // Spring Boot 플러그인 예시 (실제 사용 시 버전 명시)
    // id 'org.springframework.boot' version '2.7.5'
    // id 'io.spring.dependency-management' version '1.0.15.RELEASE' // Spring Boot 의존성 관리
    // 나쁜 예시: 필요한 플러그인 버전을 고정하지 않고 최신 버전에 의존하는 것.
    // - 예상치 못한 변경으로 빌드가 깨질 수 있습니다. 항상 안정적인 버전을 명시하는 것이 좋습니다.
}

group 'com.example.gradle.deps'
version '1.0-SNAPSHOT'

// -----------------------------------------------------------------------------
// 학습 포인트 2: `repositories` 블록 (의존성 저장소 설정)
// - 의존성(라이브러리)을 다운로드할 위치를 지정합니다.
// - `mavenCentral()`: 가장 일반적인 공개 Maven 저장소.
// - `google()`: Android 관련 의존성에 주로 사용되는 Google Maven 저장소.
// - `maven { url '...' }`: 특정 URL의 Maven 저장소를 추가합니다.
// -----------------------------------------------------------------------------
repositories {
    mavenCentral() // Maven Central Repository
    google()       // Google's Maven Repository (주로 Android 개발)
    // 나쁜 예시: 외부 의존성 관리에 프라이빗 저장소(Nexus, Artifactory) 사용 시 설정을 누락하는 것.
    // - `implementation` 등 의존성 선언 시 라이브러리를 찾지 못해 빌드 실패가 발생합니다.
    // maven {
    //     url 'https://repo.spring.io/milestone' // Spring Framework 마일스톤 빌드 저장소 예시
    // }
}

// -----------------------------------------------------------------------------
// 학습 포인트 3: `dependencies` 블록 (의존성 선언)
// - 다양한 구성(configuration)을 사용하여 의존성의 스코프를 정의합니다.
// - `implementation`: 컴파일 시점에 클래스패스에 추가되고, 런타임 시에도 필요합니다.
//   - 주로 다른 모듈이 이 모듈을 의존할 때 이 의존성이 전이되지 않습니다 (캡슐화).
// - `api`: `implementation`과 유사하지만, 이 모듈을 의존하는 다른 모듈에 이 의존성이 전이됩니다.
//   - 주로 라이브러리를 개발할 때, 라이브러리의 공용 API에 사용되는 의존성에 사용됩니다.
// - `compileOnly`: 컴파일 시에만 필요하고 런타임에는 필요 없는 의존성 (예: Lombok).
// - `runtimeOnly`: 런타임에만 필요하고 컴파일 시에는 필요 없는 의존성.
// - `testImplementation`: 테스트 코드 컴파일 및 실행에만 필요한 의존성.
// - `annotationProcessor`: 컴파일 시점에 어노테이션 프로세서를 실행하는 데 필요한 의존성.
// -----------------------------------------------------------------------------
dependencies {
    // `implementation` 예시: Guava 라이브러리
    implementation 'com.google.guava:guava:32.1.3-jre' // Guava 라이브러리 (최신 버전 사용 권장)

    // `api` 예시: (멀티 모듈 프로젝트에서 차이점 확인 가능)
    // api 'org.apache.commons:commons-lang3:3.12.0' // 다른 모듈에서 이 모듈을 사용하면 commons-lang3도 사용 가능

    // `compileOnly` 예시: Lombok (컴파일 시에만 필요)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30' // Lombok 어노테이션 프로세서

    // `runtimeOnly` 예시: H2 Database (런타임 시에만 필요, JDBC 드라이버 등)
    // runtimeOnly 'com.h2database:h2:2.2.224'

    // `testImplementation` 예시: JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    // 나쁜 예시: 모든 의존성을 `api` 또는 `implementation`으로만 선언하는 것.
    // - `compileOnly`나 `testImplementation`으로 충분한 의존성을 `implementation`으로 선언하면
    //   불필요한 의존성이 번들에 포함되거나 다른 모듈에 전이되어 빌드 크기 증가 및 잠재적 충돌 발생.
    // - 의존성 버전 관리를 제대로 하지 않아 라이브러리 충돌 (Dependency Hell) 발생.
}

// -----------------------------------------------------------------------------
// 학습 포인트 4: `application` 플러그인 설정
// - `application` 플러그인을 적용하면 `run` 태스크와 실행 가능한 JAR 파일을 만드는 태스크가 생깁니다.
// - `mainClass`: 실행될 메인 클래스를 지정합니다.
// -----------------------------------------------------------------------------
application {
    mainClass = 'com.example.gradle.deps.App' // 실행될 메인 클래스 지정
    // 나쁜 예시: `mainClass` 설정을 누락하여 `run` 태스크나 실행 가능한 JAR 파일이
    // - 정상적으로 동작하지 않는 것.
}

// -----------------------------------------------------------------------------
// 학습 포인트 5: 의존성 버전 관리 (개념)
// - `ext` 블록을 사용하거나 `gradle.properties` 파일에 버전 정보를 정의하여
//   의존성 버전을 중앙에서 관리할 수 있습니다.
// - `platform()` 또는 `bom()`: Spring Boot와 같이 여러 의존성의 호환 버전을
//   관리하는 BOM(Bill of Materials)을 가져와 의존성 버전 충돌을 방지할 수 있습니다.
// -----------------------------------------------------------------------------
ext { // Groovy DSL에서 사용자 정의 프로퍼티 정의
    junitVersion = '5.10.0'
    guavaVersion = '32.1.3-jre'
}

dependencies {
    // 위에서 정의한 프로퍼티 사용
    implementation "com.google.guava:guava:$guavaVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"

    // Spring Boot BOM 사용 예시 (plugins 블록에 spring-boot 플러그인 적용 필요)
    // implementation platform('org.springframework.boot:spring-boot-dependencies:2.7.5')
    // implementation 'org.springframework.boot:spring-boot-starter-web' // 버전 명시 없이 사용 가능
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

test {
    useJUnitPlatform()
}

// -----------------------------------------------------------------------------
// 기타 플러그인 (개념)
// - `kotlin-jvm`: Kotlin 프로젝트를 위한 플러그인.
// - `com.android.application`: Android 애플리케이션 빌드를 위한 플러그인.
// - 커스텀 플러그인: `buildSrc` 디렉토리나 별도 프로젝트로 정의하여 빌드 로직 재사용.
// -----------------------------------------------------------------------------

