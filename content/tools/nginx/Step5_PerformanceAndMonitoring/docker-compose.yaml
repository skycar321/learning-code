# nginx/Step5_PerformanceAndMonitoring/docker-compose.yaml
# Nginx 학습 계획 - 5단계: 성능 최적화 및 모니터링
# 이 파일은 Docker Compose를 사용하여 Nginx 컨테이너와 간단한 백엔드 웹 서버를 실행하고,
# Nginx에서 캐싱, Gzip 압축, 로깅 설정을 통해 성능을 최적화하고 모니터링하는 것을 시연합니다.
#
# Nginx는 고성능 웹 서버로서 다양한 최적화 기능을 제공하며,
# 효과적인 로깅과 모니터링은 서비스 운영의 안정성을 보장합니다.

version: '3.8'

services:
  nginx: # Nginx 웹 서버 (성능 최적화 및 모니터링 적용)
    image: nginx:latest
    container_name: my-nginx-optimized-webserver
    ports:
      - "80:80" # HTTP 포트
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # 호스트의 nginx.conf를 마운트
      - ./html:/usr/share/nginx/html:ro       # 정적 웹 콘텐츠 마운트
      - ./nginx-cache:/var/cache/nginx:rw     # Nginx 캐시 디렉토리 마운트 (쓰기 가능)
      - ./logs:/var/log/nginx:rw              # Nginx 로그 디렉토리 마운트 (쓰기 가능)
    depends_on:
      - backend-app
    restart: always

  backend-app: # 간단한 백엔드 애플리케이션 (느린 응답 시뮬레이션)
    image: node:14-alpine
    container_name: simple-backend-app
    command: sh -c "echo '<h1>Backend App Content</h1><p>This is from the backend app.</p>' > index.html && http-server -p 3000 -d false"
    # http-server -d false는 디렉토리 리스팅을 비활성화
    working_dir: /app
    volumes:
      - ./backend-app:/app:ro
    expose:
      - "3000" # 컨테이너 내부 3000번 포트 노출
    environment:
      - DELAY_MS=1000 # 백엔드 응답 지연 시간 (1초)
    # 실제 백엔드 앱에서는 응답 지연을 코드 레벨에서 구현해야 합니다.
    # 이 예시에서는 http-server가 바로 응답하므로, 캐싱 동작만 주로 시연합니다.
    restart: always

/*
이 코드를 실행하려면:

1. Docker 및 Docker Compose 설치.
2. `nginx/Step5_PerformanceAndMonitoring` 디렉토리를 생성하고 이 파일을 `docker-compose.yaml`로 저장.
3. `nginx/Step5_PerformanceAndMonitoring` 디렉토리에 `nginx.conf` 파일을 생성.
4. `nginx/Step5_PerformanceAndMonitoring` 디렉토리에 `html`, `backend-app`, `nginx-cache`, `logs` 서브 디렉토리를 생성.
5. `nginx/Step5_PerformanceAndMonitoring/html` 디렉토리에 `index.html` 파일을 생성.
6. `nginx/Step5_PerformanceAndMonitoring/backend-app` 디렉토리에 `index.html` 파일을 생성. (아래 예시 참조)
7. 터미널에서 `nginx/Step5_PerformanceAndMonitoring` 디렉토리로 이동.
8. `docker-compose up -d` 명령으로 컨테이너들을 백그라운드에서 실행.
9. 웹 브라우저에서 `http://localhost`로 접근하여 Nginx가 정적 파일을 제공하고 캐싱이 동작하는지 확인.
10. `docker-compose down` 명령으로 컨테이너 중지 및 삭제.
*/
