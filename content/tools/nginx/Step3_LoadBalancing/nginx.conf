# nginx/Step3_LoadBalancing/nginx.conf
# Nginx 학습 계획 - 3단계: 로드 밸런싱
# 이 파일은 Nginx를 로드 밸런서로 설정하고, 다양한 로드 밸런싱 방식을 적용하는
# Nginx 설정 파일(nginx.conf) 예시입니다.
#
# Nginx 로드 밸런싱은 여러 백엔드 서버 간에 트래픽을 분산하여
# 서비스의 가용성, 확장성, 성능을 향상시킵니다.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -----------------------------------------------------------------------------
    # 학습 포인트 1: `upstream` 블록 정의
    # - 로드 밸런싱할 백엔드 서버 그룹을 정의합니다.
    # - `server` 지시어를 사용하여 각 백엔드 서버의 주소와 포트를 지정합니다.
    # - `backend-app1`, `backend-app2`는 Docker Compose 파일에 정의된 서비스 이름입니다.
    # -----------------------------------------------------------------------------
    upstream backend_servers {
        # -----------------------------------------------------------------------------
        # 학습 포인트 2: 로드 밸런싱 방식
        # - `Round Robin` (기본값): 요청을 서버에 순서대로 분배합니다. (설정 불필요)
        # - `least_conn`: 활성 연결 수가 가장 적은 서버로 요청을 보냅니다.
        #   - 장점: 바쁜 서버에 새로운 요청이 가지 않아 부하가 균등하게 분산됩니다.
        # - `ip_hash`: 클라이언트의 IP 주소를 해시하여 동일한 클라이언트의 요청을 항상 동일한 서버로 보냅니다.
        #   - 장점: 세션 지속성(Session Persistence)이 필요할 때 유용합니다.
        # - `hash key [consistent]`: 지정된 키의 해시 값을 기반으로 서버를 선택합니다.
        # - `random [least_conn]`: 요청을 무작위로 서버에 분배합니다.
        # - `least_time header|last_byte`: 가장 빠른 응답 시간을 가진 서버로 요청을 보냅니다. (Nginx Plus 기능)
        # -----------------------------------------------------------------------------
        # Round Robin (기본값)
        server backend-app1:3000; # Docker Compose 서비스 이름과 포트
        server backend-app2:3000;

        # least_conn 방식 예시 (주석 해제 후 테스트)
        # least_conn;
        # server backend-app1:3000;
        # server backend-app2:3000;

        # ip_hash 방식 예시 (주석 해제 후 테스트)
        # ip_hash;
        # server backend-app1:3000;
        # server backend-app2:3000;

        # -----------------------------------------------------------------------------
        # 학습 포인트 3: 서버 가중치 (Weights)
        # - 특정 서버로 더 많은 트래픽을 보내도록 가중치를 부여합니다.
        # - `server backend-app1:3000 weight=3;`
        # -----------------------------------------------------------------------------
        # server backend-app1:3000 weight=3;
        # server backend-app2:3000; # backend-app1이 backend-app2보다 3배 더 많은 요청을 받음

        # -----------------------------------------------------------------------------
        # 학습 포인트 4: 서버 상태 (Server States)
        # - `down`: 서버를 영구적으로 비활성화합니다.
        # - `backup`: 다른 서버가 모두 다운되었을 때만 사용됩니다.
        # - `max_fails`, `fail_timeout`: 헬스 체크 설정. (Nginx Plus 기능)
        # -----------------------------------------------------------------------------
        # server backend-app1:3000 down; # backend-app1을 비활성화
        # server backend-app1:3000 backup; # 다른 서버가 모두 실패하면 사용

        # 나쁜 예시: 로드 밸런싱 방식이나 서버 가중치, 상태를 고려하지 않고
        # - 단순히 모든 서버를 동일하게 나열하는 것.
        # - 트래픽 패턴, 서버 성능, 세션 지속성 요구 사항 등을 고려하여
        # - 적절한 로드 밸런싱 전략을 선택하고 설정해야 합니다.
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # -----------------------------------------------------------------------------
            # 학습 포인트 5: 로드 밸런싱 적용
            # - `proxy_pass http://upstream_블록_이름;` 지시어를 사용하여
            #   `upstream` 블록에 정의된 서버 그룹으로 요청을 전달합니다.
            # -----------------------------------------------------------------------------
            proxy_pass http://backend_servers;
        }

        # -----------------------------------------------------------------------------
        # 학습 포인트 6: 세션 지속성 (Session Persistence)
        # - `ip_hash` 로드 밸런싱 방식을 사용하면 클라이언트의 IP 주소를 기준으로
        #   항상 동일한 서버로 요청을 보내 세션 지속성을 제공할 수 있습니다.
        # - `sticky` 지시어 (Nginx Plus 기능)를 사용하여 쿠키 기반의 세션 지속성을 구현할 수도 있습니다.
        # -----------------------------------------------------------------------------
        # 나쁜 예시: 세션 데이터가 특정 서버에만 저장되는데, 로드 밸런싱으로
        # - 다른 서버로 요청이 전달되어 사용자의 세션이 끊기는 것.
        # - 세션 데이터는 공유 저장소(Redis, 데이터베이스)에 저장하거나,
        # - `ip_hash`와 같은 세션 지속성 방식을 사용해야 합니다.

        # -----------------------------------------------------------------------------
        # 학습 포인트 7: 헬스 체크 (Health Checks) (Nginx Plus 기능 또는 커스텀 방식)
        # - Nginx Plus는 `health_check` 지시어를 통해 백엔드 서버의 상태를 주기적으로 확인합니다.
        # - OSS 버전에서는 `ngx_http_upstream_check_module` 같은 외부 모듈을 사용하거나,
        #   별도의 헬스 체크 시스템을 구축해야 합니다.
        # -----------------------------------------------------------------------------
        # 나쁜 예시: 백엔드 서버의 헬스 체크를 설정하지 않아 장애가 발생한 서버로
        # - 계속 트래픽을 보내 서비스 장애를 유발하는 것.
        # - 헬스 체크를 통해 비정상적인 서버를 로드 밸런싱 대상에서 자동으로 제외해야 합니다.
    }
}

/*
이 Nginx 설정 파일을 사용하려면:

1. `docker-compose.yaml` 파일과 함께 `nginx/Step3_LoadBalancing` 디렉토리에 이 파일을 `nginx.conf`로 저장.
2. `nginx/Step3_LoadBalancing` 디렉토리에 `backend-app` 서브 디렉토리를 생성하고 `index.html` 파일을 생성.
   ```html
   <!-- nginx/Step3_LoadBalancing/backend-app/index.html -->
   <!DOCTYPE html>
   <html><body><h1>Hello from Backend App!</h1><p>Served by Nginx Load Balancer.</p></body></html>
   ```
3. `docker-compose up -d` 명령으로 컨테이너들을 실행.
4. 웹 브라우저 또는 `curl`을 사용하여 `http://localhost`로 여러 번 접근.
   - 라운드 로빈 (기본값) 방식일 경우, `Backend App 1`과 `Backend App 2`의 응답이 번갈아 나타나는 것을 확인.
   - `ip_hash` 방식을 사용하려면 `nginx.conf`에서 주석을 해제하고 Nginx를 재시작(`docker-compose restart nginx`) 후 테스트.
     동일한 클라이언트 IP에서 항상 동일한 백엔드 앱의 응답을 받는지 확인.
6. `docker-compose down` 명령으로 컨테이너 중지 및 삭제.
*/
