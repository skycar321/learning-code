# nginx/Step1_NginxBasics/nginx.conf
# Nginx 학습 계획 - 1단계: Nginx 기본 개념 및 설치
# 이 파일은 Nginx 웹 서버의 기본 설정 파일(nginx.conf) 예시입니다.
# Nginx는 이 설정 파일을 읽어들여 웹 서버의 동작 방식을 결정합니다.
#
# 이 설정은 Nginx가 80번 포트에서 HTTP 요청을 수신하고,
# `/usr/share/nginx/html` 디렉토리의 정적 HTML 파일을 제공하도록 구성합니다.

# -----------------------------------------------------------------------------
# 학습 포인트 1: `main` 컨텍스트 (글로벌 설정)
# - Nginx 프로세스의 동작 방식, 워커 프로세스 수 등 글로벌 설정을 정의합니다.
# - `worker_processes`: Nginx 워커 프로세스 수 (CPU 코어 수와 같게 설정하는 것이 일반적).
# - `error_log`: Nginx 에러 로그 파일 경로 및 레벨.
# -----------------------------------------------------------------------------
worker_processes auto; # CPU 코어 수에 맞게 자동으로 설정
error_log /var/log/nginx/error.log warn; # 에러 로그 경로 및 레벨 (warn 이상 기록)

events {
    # -----------------------------------------------------------------------------
    # 학습 포인트 2: `events` 컨텍스트
    # - Nginx가 연결을 처리하는 방식과 관련된 설정을 정의합니다.
    # - `worker_connections`: 각 워커 프로세스가 동시에 처리할 수 있는 최대 연결 수.
    # -----------------------------------------------------------------------------
    worker_connections 1024; # 각 워커 프로세스가 처리할 최대 연결 수
    # 나쁜 예시: `worker_connections`를 너무 작게 설정하여 동시 연결 처리 능력 저하를 유발하는 것.
    # - 또는 너무 크게 설정하여 시스템 자원(파일 디스크립터)을 과도하게 사용하는 것.
    # - 서버의 하드웨어 스펙과 예상 트래픽을 고려하여 적절히 설정해야 합니다.
}

http {
    # -----------------------------------------------------------------------------
    # 학습 포인트 3: `http` 컨텍스트
    # - HTTP 서버의 전역 설정을 정의합니다.
    # - `include mime.types`: 파일 확장자에 따른 MIME 타입 정의.
    # - `default_type application/octet-stream`: 기본 MIME 타입 설정.
    # - `log_format`: 접근 로그의 형식 정의.
    # - `access_log`: 접근 로그 파일 경로 및 사용할 로그 형식.
    # - `sendfile on`: 파일을 효율적으로 전송 (커널이 직접 파일을 네트워크로 전송).
    # - `keepalive_timeout`: 클라이언트와의 Keepalive 연결 유지 시간.
    # - `gzip on`: Gzip 압축 활성화 (성능 최적화, 5단계에서 자세히 다룸).
    # -----------------------------------------------------------------------------
    include /etc/nginx/mime.types; # MIME 타입 파일 포함
    default_type application/octet-stream; # 기본 MIME 타입

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main; # 접근 로그 경로 및 형식

    sendfile on; # 파일 전송 효율성 증대
    keepalive_timeout 65; # Keepalive 연결 유지 시간

    # -----------------------------------------------------------------------------
    # 학습 포인트 4: `server` 컨텍스트
    # - 하나의 가상 호스트(Virtual Host)를 정의합니다.
    # - `listen`: Nginx가 수신 대기할 IP 주소와 포트.
    # - `server_name`: 이 서버 블록이 처리할 도메인 이름.
    # -----------------------------------------------------------------------------
    server {
        listen 80; # 80번 포트에서 HTTP 요청을 수신
        server_name localhost; # 이 서버 블록이 처리할 도메인 이름 (로컬 테스트용)

        # -----------------------------------------------------------------------------
        # 학습 포인트 5: `location` 컨텍스트
        # - 특정 URL 경로에 대한 요청을 처리하는 방법을 정의합니다.
        # - `root`: 요청된 파일의 루트 디렉토리.
        # - `index`: 디렉토리 요청 시 기본으로 제공할 파일명.
        # -----------------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html; # 웹 콘텐츠가 있는 디렉토리
            index index.html index.htm; # 기본 파일
            try_files $uri $uri/ =404; # 파일이 없으면 404 에러 반환 (SPA 라우팅 시 다르게 설정)
        }

        # 나쁜 예시: `root` 경로를 `/` (루트)로 설정하여 서버의 민감한 파일이 노출될 수 있게 하는 것.
        # - `root`는 항상 웹 콘텐츠가 있는 특정 디렉토리로 설정해야 합니다.
        # - 또는 `index` 파일이 없는 경우 디렉토리 리스팅(autoindex)이 활성화되어
        #   파일 목록이 노출되는 것도 보안에 취약합니다.
        # - `autoindex off;`로 디렉토리 리스팅을 비활성화하는 것이 좋습니다.
    }
}

/*
이 Nginx 설정 파일을 사용하려면:

1. `docker-compose.yaml` 파일과 함께 `nginx/Step1_NginxBasics` 디렉토리에 이 파일을 `nginx.conf`로 저장.
2. `nginx/Step1_NginxBasics` 디렉토리에 `html` 서브 디렉토리를 생성하고 `index.html` 파일을 생성.
   ```html
   <!-- nginx/Step1_NginxBasics/html/index.html -->
   <!DOCTYPE html>
   <html>
   <head>
       <title>Welcome to Nginx!</title>
       <style>
           body { width: 35em; margin: 0 auto; font-family: Tahoma, Verdana, Arial, sans-serif; }
           h1 { color: #333; }
           p { color: #555; }
       </style>
   </head>
   <body>
       <h1>Welcome to Nginx Basics!</h1>
       <p>This is a static HTML page served by Nginx.</p>
       <p>If you see this page, the nginx web server is successfully installed and working.</p>
       <p>Thank you for using Nginx.</p>
   </body>
   </html>
   ```
3. `docker-compose up -d` 명령으로 Nginx 컨테이너를 실행.
*/
