# nginx/Step1_NginxBasics/docker-compose.yaml
# Nginx 학습 계획 - 1단계: Nginx 기본 개념 및 설치
# 이 파일은 Docker Compose를 사용하여 Nginx 웹 서버를 컨테이너로 실행하고
# 정적 파일을 제공하도록 설정하는 예시입니다.
#
# Docker Compose를 사용하면 Nginx 컨테이너 및 관련 볼륨, 네트워크 설정을
# YAML 파일 하나로 간편하게 관리할 수 있습니다.

version: '3.8' # Docker Compose 파일 형식 버전

services:
  nginx: # Nginx 서비스 정의
    image: nginx:latest # 최신 Nginx Docker 이미지 사용
    container_name: my-nginx-webserver # 컨테이너 이름 지정
    ports:
      - "80:80" # 호스트의 80번 포트를 컨테이너의 80번 포트에 매핑 (HTTP)
      # - "443:443" # HTTPS를 위해 443번 포트도 매핑 가능 (4단계 SSL/TLS 학습 시 사용)
    volumes:
      # 나쁜 예시: Nginx 설정 파일을 컨테이너 내부에만 두어 컨테이너 재시작 시 설정이 초기화되는 것.
      # - Nginx 설정 파일과 웹 콘텐츠는 반드시 Docker Volume으로 마운트하여
      # - 호스트에 영구적으로 저장하고 관리해야 합니다.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # 호스트의 nginx.conf를 컨테이너에 읽기 전용으로 마운트
      - ./html:/usr/share/nginx/html:ro     # 호스트의 html 디렉토리를 컨테이너의 웹 루트에 읽기 전용으로 마운트
    restart: always # 컨테이너 종료 시 항상 재시작
    logging: # 로깅 설정
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck: # Nginx 컨테이너 헬스 체크
      test: ["CMD", "nginx", "-t"] # Nginx 설정 파일 문법 검사
      interval: 30s
      timeout: 10s
      retries: 3
    # networks: # 네트워크 설정 (선택 사항)
    #   - web-network

# networks: # 외부 네트워크 정의 (선택 사항)
#   web-network:
#     driver: bridge

/*
이 코드를 실행하려면:

1. Docker 및 Docker Compose 설치.
2. `nginx/Step1_NginxBasics` 디렉토리를 생성하고 이 파일을 `docker-compose.yaml`로 저장.
3. `nginx/Step1_NginxBasics` 디렉토리에 `nginx.conf` 파일을 생성.
4. `nginx/Step1_NginxBasics` 디렉토리에 `html` 서브 디렉토리를 생성하고 `index.html` 파일을 생성.
5. 터미널에서 `nginx/Step1_NginxBasics` 디렉토리로 이동.
6. `docker-compose up -d` 명령으로 Nginx 컨테이너를 백그라운드에서 실행.
7. 웹 브라우저에서 `http://localhost`로 접근하여 Nginx가 정적 파일을 제공하는지 확인.
8. `docker-compose down` 명령으로 컨테이너 및 네트워크 중지 및 삭제.
*/
