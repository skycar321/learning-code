# nginx/Step4_SSLTLSAndSecurity/nginx.conf
# Nginx 학습 계획 - 4단계: SSL/TLS 설정 및 보안
# 이 파일은 Nginx에 SSL/TLS를 설정하여 HTTPS를 적용하고, 기본적인 보안 설정을
# 강화하는 Nginx 설정 파일(nginx.conf) 예시입니다.
#
# HTTPS는 웹 통신을 암호화하여 데이터의 기밀성, 무결성, 인증을 보장합니다.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -----------------------------------------------------------------------------
    # 학습 포인트 1: HTTP를 HTTPS로 리다이렉션
    # - 80번 포트로 들어오는 HTTP 요청을 443번 포트의 HTTPS로 자동 리다이렉션합니다.
    # - 이는 사용자가 실수로 HTTP 주소를 입력해도 항상 보안된 연결을 사용하도록 강제합니다.
    # -----------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost; # 실제 도메인으로 변경 (예: secure.example.com)
        return 301 https://$host$request_uri; # 301 Permanent Redirect
        # 나쁜 예시: HTTP 접속을 허용하거나, HTTP 요청을 HTTPS로 리다이렉션하지 않는 것.
        # - 데이터가 평문으로 전송되어 보안에 취약합니다.
        # - 모든 HTTP 요청은 HTTPS로 강제 리다이렉션해야 합니다.
    }

    # -----------------------------------------------------------------------------
    # 학습 포인트 2: HTTPS (SSL/TLS) 설정
    # - 443번 포트에서 HTTPS 요청을 수신하도록 설정합니다.
    # - `ssl_certificate`, `ssl_certificate_key`: SSL/TLS 인증서 및 개인 키 파일 경로 지정.
    # - `ssl_protocols`: 사용 가능한 SSL/TLS 프로토콜 버전 지정 (오래된 취약한 프로토콜 비활성화).
    # - `ssl_ciphers`: 사용 가능한 암호화 스위트 지정 (강력한 암호화만 허용).
    # - `ssl_prefer_server_ciphers on`: 서버가 선호하는 암호화 스위트를 우선 사용.
    # - `add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;`:
    #   HSTS (HTTP Strict Transport Security) 헤더를 추가하여 브라우저가 항상 HTTPS로 접속하도록 강제.
    # -----------------------------------------------------------------------------
    server {
        listen 443 ssl http2; # 443번 포트에서 HTTPS 및 HTTP/2 요청을 수신
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx.crt; # SSL/TLS 인증서 파일 경로
        ssl_certificate_key /etc/nginx/certs/nginx.key; # SSL/TLS 개인 키 파일 경로

        ssl_protocols TLSv1.2 TLSv1.3; # 강력한 TLSv1.2와 TLSv1.3만 사용
        ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:HIGH:!aNULL:!MD5:!RC4:!DES:!3DES:!CBC:!kEDH:!PSK:!SRP:!DSS:!CAMELLIA';
        ssl_prefer_server_ciphers on;

        # HSTS 헤더 (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # X-Frame-Options: Clickjacking 공격 방지
        add_header X-Frame-Options "SAMEORIGIN";
        # X-Content-Type-Options: MIME 스니핑 공격 방지
        add_header X-Content-Type-Options "nosniff";
        # X-XSS-Protection: XSS 공격 방지
        add_header X-XSS-Protection "1; mode=block";
        # Referrer-Policy: Referrer 정보 제어
        add_header Referrer-Policy "no-referrer-when-downgrade";
        # Content-Security-Policy: XSS, 데이터 주입 공격 방지 (복잡하므로 필요에 따라 설정)
        # add_header Content-Security-Policy "default-src 'self'";

        location / {
            proxy_pass http://backend-app:3000; # 백엔드 애플리케이션으로 요청 전달
        }

        # 나쁜 예시: SSL/TLS 인증서 없이 자가 서명 인증서를 프로덕션 환경에 사용하는 것.
        # - 브라우저에서 경고 메시지가 발생하며, 사용자 신뢰도를 떨어뜨립니다.
        # - Let's Encrypt와 같은 신뢰할 수 있는 CA(Certificate Authority)에서 발급받은
        # - 인증서를 사용해야 합니다.
    }

    # -----------------------------------------------------------------------------
    # 학습 포인트 3: Nginx 방화벽(WAF) 기본 (Basic Nginx WAF)
    # - `limit_req`: 요청 속도 제한 (DDoS 공격 방어, API 남용 방지)
    # - `limit_conn`: 동시 연결 수 제한
    # -----------------------------------------------------------------------------
    # `limit_req_zone`: 요청 속도를 추적하기 위한 영역 정의
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s; # 10MB 메모리에 5r/s (초당 5개 요청) 제한

    server {
        listen 8080; # 8080 포트에서 요청 수신 (예시)
        server_name localhost;

        location /api/rate-limited {
            limit_req zone=mylimit burst=10 nodelay; # mylimit 존 사용, 10개까지 버스트 허용, 지연 없음
            proxy_pass http://backend-app:3000;
        }

        # 나쁜 예시: `limit_req`, `limit_conn` 설정을 누락하여
        # - DDoS 공격이나 무분별한 API 호출에 취약하게 만드는 것.
        # - 서비스의 안정성을 위해 적절한 요청/연결 제한을 설정해야 합니다.
    }

    # -----------------------------------------------------------------------------
    # 학습 포인트 4: 봇 및 스크래퍼 차단 (개념)
    # - `user_agent`를 기반으로 특정 봇이나 스크래퍼의 접근을 차단합니다.
    # - `map` 블록을 사용하여 User-Agent와 차단 여부를 매핑할 수 있습니다.
    # -----------------------------------------------------------------------------
    # map $http_user_agent $block_ua {
    #     default 0;
    #     ~*(badbot|scraper) 1; # 'badbot' 또는 'scraper'가 포함된 User-Agent 차단
    # }
    #
    # server {
    #     # ...
    #     location / {
    #         if ($block_ua) {
    #             return 403; # 차단된 User-Agent에 대해 403 Forbidden 반환
    #         }
    #         # ...
    #     }
    # }
}

/*
이 Nginx 설정 파일을 사용하려면:

1. `docker-compose.yaml` 파일과 함께 `nginx/Step4_SSLTLSAndSecurity` 디렉토리에 이 파일을 `nginx.conf`로 저장.
2. `nginx/Step4_SSLTLSAndSecurity` 디렉토리에 `html`, `certs`, `backend-app` 서브 디렉토리를 생성.
3. `generate-certs.sh` 스크립트를 실행하여 `certs` 디렉토리에 `nginx.crt`와 `nginx.key` 파일을 생성.
   ```bash
   # nginx/Step4_SSLTLSAndSecurity/generate-certs.sh
   #!/bin/bash
   mkdir -p certs
   openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout certs/nginx.key -out certs/nginx.crt -subj "/CN=localhost"
   echo "Self-signed certificates generated in certs/ directory."
   ```
4. `backend-app/index.html` 파일을 생성.
   ```html
   <!-- nginx/Step4_SSLTLSAndSecurity/backend-app/index.html -->
   <!DOCTYPE html>
   <html><body><h1>Hello from Secure Backend!</h1><p>Served via HTTPS by Nginx.</p></body></html>
   ```
5. 터미널에서 `nginx/Step4_SSLTLSAndSecurity` 디렉토리로 이동.
6. `docker-compose up -d` 명령으로 컨테이너들을 실행.
7. 웹 브라우저에서 `https://localhost`로 접근하여 HTTPS가 적용되었는지 확인.
   - 자체 서명 인증서이므로 브라우저에서 "안전하지 않은 연결" 경고가 나타날 수 있습니다. "고급" 또는 "예외 추가"를 통해 접속합니다.
   - `http://localhost`로 접근 시 HTTPS로 리다이렉션되는 것을 확인.
8. `docker-compose down` 명령으로 컨테이너 중지 및 삭제.
*/
