# nginx/Step2_ReverseProxyAndVirtualHosting/nginx.conf
# Nginx 학습 계획 - 2단계: 리버스 프록시 및 가상 호스팅
# 이 파일은 Nginx를 리버스 프록시로 설정하고, 이름 기반 가상 호스팅을 구현하는
# Nginx 설정 파일(nginx.conf) 예시입니다.
#
# Nginx는 클라이언트의 요청을 받아 실제 콘텐츠를 제공하는 백엔드 서버로 요청을 전달하고,
# 백엔드 서버로부터 받은 응답을 클라이언트에게 다시 전달하는 리버스 프록시 역할을 할 수 있습니다.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # -----------------------------------------------------------------------------
    # 학습 포인트 1: `proxy_set_header` 지시어
    # - Nginx가 백엔드 서버로 요청을 전달할 때, 요청 헤더를 수정하거나 추가합니다.
    # - `Host`: 백엔드 서버가 요청의 Host 헤더를 올바르게 인식하도록 설정.
    # - `X-Real-IP`, `X-Forwarded-For`, `X-Forwarded-Proto`: 클라이언트의 실제 IP 주소,
    #   프록시를 거쳐온 IP 주소 목록, 원래 요청의 프로토콜(HTTP/HTTPS)을 백엔드에 전달.
    # -----------------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;


    # -----------------------------------------------------------------------------
    # 학습 포인트 2: 가상 호스팅 (Virtual Hosting)
    # - 하나의 Nginx 서버에서 여러 도메인을 서비스할 수 있도록 합니다.
    # - `server` 블록 내의 `server_name` 지시어를 사용하여 도메인을 구분합니다.
    # -----------------------------------------------------------------------------

    # 첫 번째 가상 호스트: app1.example.com
    server {
        listen 80;
        server_name app1.example.com; # 이 서버 블록이 처리할 도메인 이름

        location / {
            # -----------------------------------------------------------------------------
            # 학습 포인트 3: 리버스 프록시 설정 (`proxy_pass`)
            # - `proxy_pass http://backend1:3001`: 클라이언트의 요청을 `http://backend1:3001`로 전달.
            # - `backend1`은 Docker Compose 파일에 정의된 서비스 이름입니다.
            # - 컨테이너 간 통신은 서비스 이름을 사용하여 이루어집니다.
            # -----------------------------------------------------------------------------
            proxy_pass http://backend1:3001; # backend1 컨테이너의 3001번 포트로 요청 전달
            # 나쁜 예시: `proxy_pass` 뒤에 슬래시(`/`)를 붙이는 것과 붙이지 않는 것의 차이를 이해하지 못하는 것.
            # - `proxy_pass http://backend1:3001/`: 요청 URI의 경로를 백엔드 서버로 그대로 전달합니다.
            # - `proxy_pass http://backend1:3001`: 요청 URI의 경로를 백엔드 서버로 재작성하여 전달할 수 있습니다.
            # - 여기서는 `/`를 붙이지 않아 요청 URI가 그대로 전달되도록 합니다.
        }

        # -----------------------------------------------------------------------------
        # 학습 포인트 4: HTTP/HTTPS 리다이렉션 (개념)
        # - 클라이언트가 HTTP로 접속하면 HTTPS로 자동 리다이렉션하는 설정입니다.
        # - 4단계 SSL/TLS 학습 시 상세하게 다룹니다.
        # -----------------------------------------------------------------------------
        # server {
        #     listen 80;
        #     server_name app1.example.com;
        #     return 301 https://$host$request_uri; # HTTP를 HTTPS로 리다이렉션
        # }
    }

    # 두 번째 가상 호스트: app2.example.com
    server {
        listen 80;
        server_name app2.example.com;

        location / {
            proxy_pass http://backend2:3002; # backend2 컨테이너의 3002번 포트로 요청 전달
        }
    }

    # 기본 가상 호스트 (catch-all)
    server {
        listen 80 default_server; # `default_server`는 일치하는 `server_name`이 없을 때 사용
        server_name _; # `_`는 유효하지 않은 도메인 이름을 나타내며, catch-all 서버로 사용

        location / {
            return 444; # 클라이언트 연결을 끊음 (정보를 제공하지 않음)
            # 또는 403 Forbidden, 404 Not Found 등으로 설정
        }
        # 나쁜 예시: `default_server`를 설정하지 않아 의도치 않은 도메인으로 들어오는
        # - 요청이 다른 `server` 블록에 의해 처리되도록 하는 것.
        # - 항상 `default_server`를 설정하여 정의되지 않은 요청을 명확하게 처리해야 합니다.
    }

    # -----------------------------------------------------------------------------
    # 학습 포인트 5: 웹소켓 프록시 설정 (개념)
    # - WebSocket 프로토콜은 HTTP와는 다른 핸드셰이크 및 연결 유지 방식을 가집니다.
    # - Nginx를 통해 WebSocket 트래픽을 프록시하려면 추가 설정이 필요합니다.
    # -----------------------------------------------------------------------------
    # location /ws {
    #     proxy_pass http://backend_websocket_server;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 86400; # 24시간 동안 연결 유지
    # }
}

/*
이 Nginx 설정 파일을 사용하려면:

1. `docker-compose.yaml` 파일과 함께 `nginx/Step2_ReverseProxyAndVirtualHosting` 디렉토리에 이 파일을 `nginx.conf`로 저장.
2. `nginx/Step2_ReverseProxyAndVirtualHosting` 디렉토리에 `backend1` 및 `backend2` 서브 디렉토리를 생성하고
   각각에 `index.html` 파일을 생성.
   ```html
   <!-- nginx/Step2_ReverseProxyAndVirtualHosting/backend1/index.html -->
   <!DOCTYPE html>
   <html><body><h1>Hello from Backend 1!</h1><p>Served by Nginx Reverse Proxy.</p></body></html>
   ```
   ```html
   <!-- nginx/Step2_ReverseProxyAndVirtualHosting/backend2/index.html -->
   <!DOCTYPE html>
   <html><body><h1>Hello from Backend 2!</h1><p>Served by Nginx Reverse Proxy.</p></body></html>
   ```
3. `docker-compose up -d` 명령으로 컨테이너들을 실행.
4. `/etc/hosts` 파일 수정 (macOS/Linux: `/etc/hosts`, Windows: `C:\Windows\System32\drivers\etc\hosts`)
   ```
   127.0.0.1 app1.example.com
   127.0.0.1 app2.example.com
   ```
5. 웹 브라우저 또는 `curl`을 사용하여 `http://app1.example.com` 및 `http://app2.example.com`으로 접근하여
   각각 `Backend 1`과 `Backend 2`의 응답이 표시되는지 확인.
   - `curl http://app1.example.com`
   - `curl http://app2.example.com`
6. `docker-compose down` 명령으로 컨테이너 중지 및 삭제.
*/
