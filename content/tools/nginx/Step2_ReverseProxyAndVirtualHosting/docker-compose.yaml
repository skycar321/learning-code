# nginx/Step2_ReverseProxyAndVirtualHosting/docker-compose.yaml
# Nginx 학습 계획 - 2단계: 리버스 프록시 및 가상 호스팅
# 이 파일은 Docker Compose를 사용하여 Nginx 컨테이너와 두 개의 간단한 백엔드 웹 서버를
# 컨테이너로 실행하는 예시입니다.
#
# Nginx가 이 백엔드 서버들로 요청을 리버스 프록시하고,
# 가상 호스팅을 통해 다른 도메인으로 서비스하는 것을 시연합니다.

version: '3.8'

services:
  nginx: # Nginx 리버스 프록시 서버
    image: nginx:latest
    container_name: my-nginx-proxy
    ports:
      - "80:80" # 호스트의 80번 포트를 Nginx 컨테이너의 80번 포트에 매핑
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # 호스트의 nginx.conf를 마운트
      # 나쁜 예시: Nginx 설정 파일을 Docker 이미지 내부에 빌드하여
      # - 설정 변경 시마다 이미지를 다시 빌드해야 하는 것.
      # - 설정 파일은 볼륨으로 마운트하여 유연하게 변경하고 적용할 수 있도록 해야 합니다.
    depends_on: # backend1과 backend2 서비스가 먼저 시작된 후 Nginx가 시작되도록 설정
      - backend1
      - backend2
    restart: always

  backend1: # 첫 번째 백엔드 웹 서버 (Node.js 또는 Python Flask 등으로 시뮬레이션)
    image: node:14-alpine # 간단한 Node.js 웹 서버 이미지
    container_name: backend-service-1
    command: sh -c "echo 'Hello from Backend 1!' > index.html && http-server -p 3001" # 3001 포트에서 HTML 제공
    working_dir: /app
    volumes:
      - ./backend1:/app:ro # 호스트의 backend1 디렉토리를 컨테이너에 마운트
    expose:
      - "3001" # 컨테이너 내부 3001번 포트 노출 (호스트에는 매핑되지 않음, Nginx에서 접근)
    restart: always

  backend2: # 두 번째 백엔드 웹 서버
    image: node:14-alpine # 간단한 Node.js 웹 서버 이미지
    container_name: backend-service-2
    command: sh -c "echo 'Hello from Backend 2!' > index.html && http-server -p 3002" # 3002 포트에서 HTML 제공
    working_dir: /app
    volumes:
      - ./backend2:/app:ro # 호스트의 backend2 디렉토리를 컨테이너에 마운트
    expose:
      - "3002" # 컨테이너 내부 3002번 포트 노출
    restart: always

/*
이 코드를 실행하려면:

1. Docker 및 Docker Compose 설치.
2. `nginx/Step2_ReverseProxyAndVirtualHosting` 디렉토리를 생성하고 이 파일을 `docker-compose.yaml`로 저장.
3. `nginx/Step2_ReverseProxyAndVirtualHosting` 디렉토리에 `nginx.conf` 파일을 생성.
4. `nginx/Step2_ReverseProxyAndVirtualHosting/backend1` 및 `backend2` 서브 디렉토리를 생성하고
   각각에 `index.html` 파일을 생성. (아래 예시 참조)
5. 터미널에서 `nginx/Step2_ReverseProxyAndVirtualHosting` 디렉토리로 이동.
6. `docker-compose up -d` 명령으로 컨테이너들을 백그라운드에서 실행.
7. 웹 브라우저에서 `http://localhost` 또는 `http://app1.example.com` 등으로 접근하여 테스트.
   (`app1.example.com` 도메인 테스트를 위해 `hosts` 파일 수정 필요)
8. `docker-compose down` 명령으로 컨테이너 중지 및 삭제.
*/
