# kubernetes/Step5_AdvancedFeaturesAndOperations.helmchart/templates/service.yaml
# Kubernetes 학습 계획 - 5단계: 고급 기능 및 운영 (Helm Chart 예시)
# 이 파일은 Helm Chart의 `templates/service.yaml` 예시입니다.
# `templates` 디렉토리 내의 파일들은 Helm이 Kubernetes manifests를 렌더링하는 데 사용하는
# Go 템플릿 언어로 작성됩니다. `values.yaml`에 정의된 값들을 여기에서 참조하여 사용합니다.

apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-advanced-app-chart.fullname" . }} # Chart의 전체 이름 (헬퍼 함수 사용)
  labels:
    {{- include "my-advanced-app-chart.labels" . | nindent 4 }} # Chart의 공통 레이블 (헬퍼 함수 사용)
spec:
  type: {{ .Values.service.type }} # values.yaml의 서비스 타입 사용
  ports:
    - port: {{ .Values.service.port }} # values.yaml의 서비스 포트 사용
      targetPort: http # 컨테이너 포트 (deployment.yaml의 name: http와 일치)
      protocol: TCP
      name: http
  selector:
    {{- include "my-advanced-app-chart.selectorLabels" . | nindent 4 }} # Chart의 셀렉터 레이블 (헬퍼 함수 사용)
