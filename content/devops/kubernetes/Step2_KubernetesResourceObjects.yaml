# kubernetes/Step2_KubernetesResourceObjects.yaml
# Kubernetes 학습 계획 - 2단계: Kubernetes 리소스 객체
# 이 파일은 Kubernetes의 가장 기본적이고 핵심적인 리소스 객체인
# Pod, Deployment, Service의 정의를 포함하는 YAML 예시입니다.
#
# Kubernetes는 이러한 선언적인(declarative) 리소스 정의를 통해
# 클러스터의 원하는 상태(desired state)를 관리합니다.

# -----------------------------------------------------------------------------
# 학습 포인트 1: Pod (파드)
# - Kubernetes에서 배포할 수 있는 가장 작은 단위.
# - 하나 이상의 컨테이너(Docker 등)를 포함하며, 스토리지 및 네트워크 리소스를 공유합니다.
# - Pod는 일시적(ephemeral)이며, 직접 생성하기보다는 Deployment와 같은 상위 컨트롤러에 의해 관리됩니다.
# -----------------------------------------------------------------------------
apiVersion: v1 # Kubernetes API 버전
kind: Pod      # 리소스 타입: Pod
metadata:
  name: my-nginx-pod # Pod의 고유한 이름
  labels:           # Pod를 식별하는 키-값 쌍 (Deployment, Service 등에서 선택자로 사용)
    app: nginx      # 애플리케이션 이름 레이블
    env: dev        # 환경 레이블
spec:
  containers: # Pod 내에서 실행될 컨테이너 목록
  - name: nginx-container # 컨테이너 이름
    image: nginx:1.14.2   # 사용할 Docker 이미지 (nginx 웹 서버)
    ports:              # 컨테이너가 노출할 포트
    - containerPort: 80 # HTTP 기본 포트

# 나쁜 예시: 프로덕션 환경에서 Pod를 직접 관리하는 것.
# - Pod는 노드 장애 시 자동으로 복구되지 않고, 스케일링도 수동으로 해야 합니다.
# - 항상 Deployment와 같은 상위 컨트롤러를 통해 Pod를 관리하는 것이 좋습니다.

---

# -----------------------------------------------------------------------------
# 학습 포인트 2: Deployment (디플로이먼트)
# - Pod와 ReplicaSet을 선언적으로 관리하는 상위 리소스입니다.
# - 애플리케이션의 롤링 업데이트, 롤백, 수평적 스케일링을 가능하게 합니다.
# - 원하는 수의 Pod 복제본을 유지하고, 업데이트 전략을 정의합니다.
# -----------------------------------------------------------------------------
apiVersion: apps/v1 # Kubernetes API 버전 (Deployment는 apps/v1 API 그룹에 속함)
kind: Deployment    # 리소스 타입: Deployment
metadata:
  name: my-nginx-deployment # Deployment의 고유한 이름
  labels:
    app: nginx
spec:
  replicas: 3 # 원하는 Pod 복제본의 수 (3개)
  selector:   # 이 Deployment가 관리할 Pod를 선택하는 레이블 셀렉터
    matchLabels:
      app: nginx # app: nginx 레이블을 가진 Pod를 관리
  template:     # Pod를 생성하기 위한 템플릿 (Pod 스펙과 동일)
    metadata:
      labels:
        app: nginx # 이 Deployment가 생성할 Pod에 부여할 레이블
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.14.2
        ports:
        - containerPort: 80
        resources: # 컨테이너가 사용할 리소스 요청 및 제한 (자세한 내용은 5단계)
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
  strategy: # Pod 업데이트 전략
    type: RollingUpdate # 롤링 업데이트 (기본값)
    rollingUpdate:
      maxUnavailable: 1 # 업데이트 중 사용할 수 없는 Pod의 최대 개수
      maxSurge: 1       # 업데이트 중 생성될 수 있는 Pod의 최대 개수

# 나쁜 예시: `replicas`를 1로 설정하여 고가용성(High Availability)을 포기하는 것.
# - 단일 Pod 장애 시 서비스 중단이 발생할 수 있습니다.
# - 애플리케이션의 중요도에 따라 최소 2개 이상의 복제본을 유지하는 것이 좋습니다.

---

# -----------------------------------------------------------------------------
# 학습 포인트 3: Service (서비스)
# - Pod 집합에 대한 안정적인 네트워크 엔드포인트를 제공합니다.
# - Pod는 IP 주소가 동적으로 변경될 수 있으므로, Service를 통해 고정된 접근 포인트를 제공합니다.
# - Load Balancing: Service는 여러 Pod로 들어오는 트래픽을 자동으로 분산합니다.
# -----------------------------------------------------------------------------
apiVersion: v1 # Kubernetes API 버전
kind: Service  # 리소스 타입: Service
metadata:
  name: my-nginx-service # Service의 고유한 이름
  labels:
    app: nginx
spec:
  selector: # 이 Service가 트래픽을 전달할 Pod를 선택하는 레이블 셀렉터
    app: nginx # app: nginx 레이블을 가진 Pod로 트래픽을 전달
  ports:
  - protocol: TCP
    port: 80         # Service가 노출할 포트
    targetPort: 80   # Pod의 컨테이너가 노출하는 포트
  type: ClusterIP    # 서비스 타입 (클러스터 내부에서만 접근 가능)
                     # 다른 타입: NodePort, LoadBalancer, ExternalName
# 나쁜 예시: Service를 사용하지 않고 Pod의 IP 주소에 직접 접근하려 하는 것.
# - Pod의 IP는 언제든지 변경될 수 있으므로 서비스 중단이 발생합니다.
# - Service를 통해 Pod에 대한 안정적인 접근점을 확보해야 합니다.

---

