# ArgoCD 고급 기능 - Kustomize 배포 예시
# 이 파일은 ArgoCD 학습 계획의 4단계인 'GitOps 워크플로우 및 고급 기능'을 위한
# Kustomize 배포 예시입니다.
# ArgoCD를 사용하여 Git Repository에 있는 Kustomize 구성을 Kubernetes 클러스터에
# 배포하는 방법을 보여줍니다.

# -----------------------------------------------------------------------------
# 1. ArgoCD Application 정의 (ArgoCD Application Definition for Kustomize)
# -----------------------------------------------------------------------------
# ArgoCD Application 리소스는 Kustomize 구성을 배포하기 위한 Source 필드에
# kustomize 설정을 포함합니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-kustomize-app      # ArgoCD UI/CLI에서 보여질 애플리케이션 이름
  namespace: argocd          # ArgoCD가 설치된 네임스페이스
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default           # 이 애플리케이션이 속할 ArgoCD 프로젝트

  # -------------------------------------------------------------------------
  # 2. Source 설정 (Source Configuration for Kustomize)
  # -------------------------------------------------------------------------
  # Git Repository에 Kustomize 구성이 있는 경우의 Source 설정입니다.
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git # 예시 Git Repository URL (Kustomize 포함)
    targetRevision: HEAD         # 사용할 Git 브랜치, 태그 또는 커밋
    path: kustomize-guestbook    # Git Repository 내에서 Kustomize base 또는 overlay 디렉토리 경로
    kustomize:                   # Kustomize 특화 설정
      namePrefix: "dev-"         # Kustomize에서 리소스 이름에 접두사 추가
      # images:                    # Kustomize에서 이미지 태그 또는 레지스트리 오버라이드
      #   - name: quay.io/argoproj/argocd-example-apps_guestbook
      #     newName: my-registry/my-guestbook
      #     newTag: v1.0.1

  # -------------------------------------------------------------------------
  # 3. Destination 설정 (Destination Configuration)
  # -------------------------------------------------------------------------
  # 애플리케이션이 배포될 Kubernetes 클러스터와 네임스페이스를 정의합니다.
  destination:
    server: https://kubernetes.default.svc
    namespace: kustomize-guestbook-namespace # Kustomize 애플리케이션이 배포될 네임스페이스

  # -------------------------------------------------------------------------
  # 4. 동기화 정책 (Sync Policy)
  # -------------------------------------------------------------------------
  # 여기서는 Step3와 동일한 자동 동기화 정책을 사용합니다.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# -----------------------------------------------------------------------------
# 이 Kustomize Application을 ArgoCD에 생성하는 방법 (How to create this Kustomize Application in ArgoCD)
# -----------------------------------------------------------------------------
# 1. 위 YAML 내용을 파일로 저장합니다 (예: my-kustomize-app.yaml).
# 2. 다음 명령어로 ArgoCD에 Application을 생성합니다:
#    kubectl apply -n argocd -f my-kustomize-app.yaml
# 3. ArgoCD UI 또는 CLI를 통해 애플리케이션 상태를 확인합니다.
