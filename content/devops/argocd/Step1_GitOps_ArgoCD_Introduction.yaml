# ArgoCD GitOps 및 소개 기본 YAML 예시

# 이 파일은 ArgoCD 학습 계획의 1단계인 'GitOps 및 ArgoCD 기본'을 이해하기 위한 개념적인 YAML 예시입니다.
# 실제 실행 가능한 코드는 아니며, GitOps의 기본 원칙과 ArgoCD 애플리케이션의
# 구조를 이해하는 데 중점을 둡니다.

# -----------------------------------------------------------------------------
# GitOps 기본 원칙 이해 (Understanding GitOps Basic Principles)
# -----------------------------------------------------------------------------
# GitOps는 Git을 "단일 진실 공급원(Single Source of Truth)"으로 사용하여
# 인프라 및 애플리케이션 배포를 자동화하는 운영 프레임워크입니다.
# 모든 변경 사항은 Git을 통해 추적되고 관리됩니다.

# Git Repository:
#   - 인프라(Kubernetes manifests) 및 애플리케이션 코드가 저장되는 곳입니다.
#   - 모든 변경 이력은 Git에 남습니다.

# Declarative Configuration:
#   - 시스템의 원하는 상태를 선언적으로 명시합니다. (예: Kubernetes YAML)

# Automated Synchronization:
#   - Git Repository의 변경 사항이 자동으로 클러스터에 적용됩니다.
#   - ArgoCD가 이 역할을 수행하는 대표적인 도구입니다.

# Reconciliation:
#   - ArgoCD는 Git의 "원하는 상태"와 클러스터의 "실제 상태"를 지속적으로 비교하고,
#   - 불일치가 발생하면 "원하는 상태"로 되돌리려 합니다 (Self-healing).

# -----------------------------------------------------------------------------
# ArgoCD 소개 및 아키텍처 (Introduction to ArgoCD & Architecture)
# -----------------------------------------------------------------------------
# ArgoCD는 GitOps를 Kubernetes에서 구현하기 위한 선언적 지속적 배포(CD) 도구입니다.

# 주요 구성 요소:
# - API Server: ArgoCD UI, CLI 및 CI/CD 파이프라인에서 사용되는 gRPC/REST 서버입니다.
# - Repository Server: Git Repository의 애플리케이션 매니페스트를 관리합니다.
# - Application Controller: 클러스터의 실제 상태를 모니터링하고 Git의 원하는 상태와 비교합니다.
# - Dex: SSO (Single Sign-On) 및 OIDC (OpenID Connect) 인증을 위한 구성 요소입니다.
# - Redis: 캐싱 및 세션 저장을 위한 데이터베이스입니다.

# -----------------------------------------------------------------------------
# ArgoCD 애플리케이션의 개념적 구조 (Conceptual Structure of an ArgoCD Application)
# -----------------------------------------------------------------------------
# 아래 YAML은 ArgoCD에서 관리하는 'Application' 리소스의 기본적인 구조를 보여줍니다.
# 실제 ArgoCD에 배포될 애플리케이션을 정의하는 Kubernetes Custom Resource Definition (CRD)입니다.

# apiVersion: argoproj.io/v1alpha1
# kind: Application
# metadata:
#   name: my-first-argocd-app # ArgoCD 내에서 애플리케이션을 식별하는 이름
#   namespace: argocd         # ArgoCD가 설치된 네임스페이스
# spec:
#   project: default          # 애플리케이션이 속할 ArgoCD 프로젝트 (기본값: default)
#   source:
#     repoURL: https://github.com/your-org/your-app-repo.git # 애플리케이션 매니페스트가 있는 Git Repository URL
#     targetRevision: HEAD    # 사용할 Git 브랜치, 태그 또는 커밋 (예: HEAD, main, v1.0.0)
#     path: kubernetes        # Git Repository 내에서 매니페스트 파일이 있는 경로
#   destination:
#     server: https://kubernetes.default.svc # 애플리케이션이 배포될 Kubernetes 클러스터의 API 서버 URL
#     namespace: my-app-namespace          # 애플리케이션이 배포될 Kubernetes 네임스페이스
#   syncPolicy:
#     automated:              # 자동 동기화 설정
#       prune: true           # Git에 없는 리소스를 클러스터에서 제거할지 여부
#       selfHeal: true        # 클러스터의 상태가 Git과 다를 경우 자동으로 복구할지 여부
#     syncOptions:
#       - CreateNamespace=true # 대상 네임스페이스가 없으면 생성
