# nginx/Step5_PerformanceAndMonitoring/nginx.conf
# Nginx 학습 계획 - 5단계: 성능 최적화 및 모니터링
# 이 파일은 Nginx의 성능 최적화 기능(캐싱, Gzip 압축, Keepalive)과
# 모니터링(접근 로그, 에러 로그, Nginx 상태) 설정을 보여주는 nginx.conf 예시입니다.
#
# Nginx는 다양한 기능을 통해 웹 서버의 응답 속도를 높이고,
# 서버 자원 사용량을 효율적으로 관리하며, 시스템 상태를 파악할 수 있도록 돕습니다.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -----------------------------------------------------------------------------
    # 학습 포인트 1: 접근 로그 및 에러 로그 관리
    # - `access_log`: 모든 HTTP 요청에 대한 로그를 기록합니다. `main` 형식 사용.
    # - `error_log`: Nginx 자체에서 발생하는 에러 로그를 기록합니다.
    # - `log_format`: 커스텀 로그 형식을 정의할 수 있습니다.
    # -----------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '$request_time $upstream_response_time'; # 요청 처리 시간 및 백엔드 응답 시간 추가

    access_log /var/log/nginx/access.log main; # /var/log/nginx/access.log 파일에 로그 기록
    error_log /var/log/nginx/error.log warn;   # /var/log/nginx/error.log 파일에 warn 레벨 이상 로그 기록

    # 나쁜 예시: 로그 설정을 누락하거나, 모든 로그를 콘솔에만 출력하여
    # - 시스템 상태를 추적하기 어렵게 만들고, 문제 발생 시 원인 분석을 어렵게 하는 것.
    # - 항상 적절한 로그 레벨과 파일 경로를 설정하여 로그를 관리해야 합니다.

    sendfile on;
    keepalive_timeout 65; # ---------------------------------------------------- 학습 포인트 2: Keepalive Connection (연결 유지)
    # - 클라이언트와 Nginx 간의 연결을 재사용하여 TCP 핸드셰이크 오버헤드를 줄입니다.
    # - 웹 페이지 로드 시 다수의 리소스를 가져올 때 성능 향상에 기여합니다.
    # - `keepalive_timeout`은 연결을 유지할 시간.
    # -----------------------------------------------------------------------------


    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -----------------------------------------------------------------------------
    # 학습 포인트 3: 캐싱 설정 (`proxy_cache`)
    # - Nginx가 백엔드 서버의 응답을 캐싱하여, 동일한 요청에 대해 백엔드에 다시 접근하지 않고
    #   캐시된 콘텐츠를 제공합니다. 이는 백엔드 서버의 부하를 줄이고 응답 속도를 높입니다.
    # - `proxy_cache_path`: 캐시 파일을 저장할 디렉토리 및 캐시 설정 (최대 크기, 만료 시간 등).
    #   - `levels=1:2`: 캐시 디렉토리의 계층 구조 (예: /data/cache/a/b/c).
    #   - `keys_zone=my_cache:10m`: 캐시 키를 저장할 공유 메모리 영역 이름과 크기.
    #   - `max_size=1g`: 캐시 디렉토리의 최대 크기 (1GB).
    #   - `inactive=60m`: 60분 동안 사용되지 않은 캐시 파일을 삭제.
    #   - `use_temp_path=off`: 캐시 파일을 임시 디렉토리에 저장하지 않고 직접 캐시 디렉토리에 저장.
    # -----------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g
                     inactive=60m use_temp_path=off;

    # -----------------------------------------------------------------------------
    # 학습 포인트 4: Gzip 압축 (`gzip on`)
    # - 클라이언트에게 응답 데이터를 전송하기 전에 Gzip으로 압축하여 네트워크 트래픽을 줄입니다.
    # - `gzip_comp_level`: 압축 레벨 (1-9, 높을수록 압축률 좋지만 CPU 사용량 증가).
    # - `gzip_types`: 압축할 MIME 타입 지정.
    # -----------------------------------------------------------------------------
    gzip on; # Gzip 압축 활성화
    gzip_vary on; # Vary: Accept-Encoding 헤더를 추가하여 프록시 서버가 캐싱할 때 도움이 됨
    gzip_proxied any; # 모든 프록시 요청에 대해 Gzip 압축
    gzip_comp_level 6; # 압축 레벨 (기본값은 1, 6이 적절)
    gzip_buffers 16 8k; # 압축에 사용될 버퍼 수 및 크기
    gzip_http_version 1.1; # HTTP/1.1 이상의 버전에서 Gzip 압축
    gzip_min_length 256; # 256바이트 미만의 파일은 압축하지 않음
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # 나쁜 예시: Gzip 압축을 사용하지 않아 네트워크 트래픽을 비효율적으로 사용하는 것.
    # - Gzip 압축은 대부분의 웹 콘텐츠에서 상당한 트래픽 절감 효과를 가져옵니다.

    server {
        listen 80;
        server_name localhost;

        # Nginx 상태 모니터링 (stub_status)
        location /nginx_status {
            stub_status on; # Nginx 상태 정보를 노출하는 모듈 활성화
            access_log off; # 이 경로에 대한 접근 로그는 기록하지 않음
            allow 127.0.0.1; # 127.0.0.1 (로컬호스트)에서만 접근 허용
            deny all; # 그 외 모든 IP는 접근 거부
            # 나쁜 예시: `stub_status`를 보호되지 않은 상태로 외부에 노출하는 것.
            # - Nginx의 민감한 상태 정보가 노출되어 보안 위협이 될 수 있습니다.
            # - 반드시 접근을 제한해야 합니다.
        }

        location /static/ {
            root /usr/share/nginx/html; # 정적 파일 제공
            # -----------------------------------------------------------------------------
            # 학습 포인트 5: 브라우저 캐싱 (Expires, Cache-Control)
            # - 정적 파일에 대해 브라우저 캐싱을 설정하여 클라이언트가 파일을 다시 다운로드하지 않도록 합니다.
            # - `expires`: 브라우저 캐싱 유효 기간 설정.
            # -----------------------------------------------------------------------------
            expires 30d; # 정적 파일은 30일 동안 브라우저에 캐싱
        }

        location / {
            proxy_pass http://backend-app:3000;
            proxy_cache my_cache; # `my_cache`라는 캐시 영역 사용
            proxy_cache_valid 200 302 10m; # 200, 302 응답은 10분 동안 캐시
            proxy_cache_valid 404 1m; # 404 응답은 1분 동안 캐시
            proxy_cache_min_uses 1; # 최소 1번 요청된 후에 캐시 시작
            proxy_cache_revalidate on; # 캐시된 콘텐츠의 유효성 재검증
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504; # 백엔드 에러 시 스태일(stale) 캐시 사용

            # 나쁜 예시: 모든 요청을 캐싱하거나, 캐시 유효 기간을 너무 길게 설정하는 것.
            # - 캐싱은 적절한 콘텐츠(변경이 잦지 않은)에만 적용하고, 유효 기간을 적절히 설정해야 합니다.
            # - 동적인 콘텐츠나 사용자별로 다른 콘텐츠를 캐싱하면 잘못된 정보를 제공할 수 있습니다.
        }
    }
}

/*
이 Nginx 설정 파일을 사용하려면:

1. `docker-compose.yaml` 파일과 함께 `nginx/Step5_PerformanceAndMonitoring` 디렉토리에 이 파일을 `nginx.conf`로 저장.
2. `nginx/Step5_PerformanceAndMonitoring` 디렉토리에 `html`, `backend-app`, `nginx-cache`, `logs` 서브 디렉토리를 생성.
3. `nginx/Step5_PerformanceAndMonitoring/html/index.html` 및 `backend-app/index.html` 파일을 생성.
   ```html
   <!-- nginx/Step5_PerformanceAndMonitoring/html/index.html -->
   <!DOCTYPE html>
   <html><body><h1>Hello from Static Content!</h1><p>This is a static HTML page.</p></body></html>
   ```
   ```html
   <!-- nginx/Step5_PerformanceAndMonitoring/backend-app/index.html -->
   <!DOCTYPE html>
   <html><body><h1>Backend App Content</h1><p>This is from the backend app.</p><p>Time: <script>document.write(new Date().toLocaleTimeString())</script></p></body></html>
   ```
4. 터미널에서 `nginx/Step5_PerformanceAndMonitoring` 디렉토리로 이동.
5. `docker-compose up -d` 명령으로 컨테이너들을 실행.
6. 웹 브라우저에서 `http://localhost`로 접근.
   - 첫 접근 시에는 백엔드에서 데이터를 가져와 시간이 지연될 수 있습니다.
   - 두 번째 접근부터는 Nginx 캐시에서 데이터를 가져와 응답 속도가 빨라지는 것을 확인합니다. (`Cache-Control` 헤더 확인)
   - 개발자 도구의 네트워크 탭에서 응답 헤더에 `X-Cache: HIT` (캐시 히트) 또는 `X-Cache: MISS` (캐시 미스)를 확인.
   - `http://localhost/nginx_status`로 접근하여 Nginx의 상태 정보 확인 (로컬에서만 가능).
   - `docker-compose logs nginx` 명령으로 Nginx 접근 로그 및 에러 로그 확인.
7. `docker-compose down` 명령으로 컨테이너 중지 및 삭제.
*/
