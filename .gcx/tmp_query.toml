name = "nam:gcx-query"
description = "Usage: /gcx-query \"질문\" --type [debug|arch|fe|concept] (type 은 선택)"
category = "workflow"
complexity = "high"
mcp_servers = ["sequential", "superagent:gemini", "context7"]
agents = ["query-consultant", "codex-debugger", "claude-explainer", "gemini-designer"]

prompt = """
# /nam:gcx-query - Query & Issue Resolution (v3.3)

> **Context Framework Note**: This behavioral instruction activates the GCX Query Consultant. It analyzes user questions or issues and routes them to the optimal agent combination (Gemini, Claude, Codex) for efficient resolution.

**Version**: 3.3 Enhanced (Windows Optimized)
**Major Changes**: Windows Script Strategy, TDD support, Over-Engineering Review

## Step 0: Model Selection (MANDATORY)

**CRITICAL**: Before proceeding, MUST ask user for model preferences if not specified in request.

**Commit Policy**:
- NEVER automatically commit changes
- When commit-worthy changes are made, generate commit message and suggest to user

---


## Windows Execution Strategy (CRITICAL - v3.3)

**Problem**: Windows PowerShell encoding issues (Mojibake) and CLI parsing errors.

**Action**:
1. **Prefer Bash Scripts**: For cross-AI invocations, create a temporary `.sh` script using `write_file`, then execute with `run_shell_command(\"bash script.sh\")`.
2. **Force UTF-8**: If using PowerShell directly, ALWAYS pipe to `Out-File -Encoding UTF8`.
   - `cmd > file.txt` -> **FORBIDDEN** on Windows
   - `cmd | Out-File -Encoding UTF8 file.txt` -> **REQUIRED**

---


## Design Authority (CRITICAL)

**Gemini has ABSOLUTE authority on all UI/UX design decisions.**
Claude/Codex review **code quality ONLY**.

---


## Behavioral Flow (v3.3 Enhanced)

1. **Model Selection**: ASK user.
2. **Initialize**: Read `_gcx_roles.md`.
3. **Requirement Capture**: SAVE user request to `.gcx/00_requirements/`.
4. **Classify & Route**: Select pipeline.
5. **TDD Check**: Codex generates tests FIRST.
6. **Execute**: Perform task using **File-Based Handoff (via Bash Scripts)**.
7. **Quality Gate**: Claude reviews (via script).
8. **Codex Audit**: Deep Audit (via script).
9. **Final Summary**: Gemini summarizes.

## Key Behaviors
- **Windows Optimized**: Use `.sh` scripts for stability.
- **Smart Routing**: Optimize for speed.
- **TDD Enforcement**: Tests first.
- **Over-Engineering Guard**: Prevent complexity.

## Reference
- Protocol: `C:/Users/Nam/.gemini/commands/nam/GCX_MASTER_PROTOCOL.md`
- CLI Guide: `C:/Users/Nam/.gemini/commands/nam/_cross_ai_invocation.md`
"""
