// gradle/Step1_GradleBasics/settings.gradle
// Gradle 기본 개념 및 시작 학습을 위한 settings.gradle 파일 예시입니다.
// 이 파일은 단일 프로젝트 빌드에서는 간단하게 프로젝트 이름을 정의하고,
// 멀티 프로젝트 빌드에서는 포함될 서브 프로젝트를 선언하는 역할을 합니다.
//
// `settings.gradle` 파일은 `build.gradle` 파일보다 먼저 실행되며,
// 빌드에 포함될 프로젝트들을 결정합니다.

// -----------------------------------------------------------------------------
// 학습 포인트 1: `rootProject.name`
// - 현재 빌드의 루트 프로젝트 이름을 정의합니다.
// - 이 이름은 빌드 보고서나 생성되는 아티팩트 이름의 일부로 사용될 수 있습니다.
// -----------------------------------------------------------------------------
rootProject.name = 'step1-gradle-basics' // 루트 프로젝트 이름 정의

// -----------------------------------------------------------------------------
// 학습 포인트 2: `include` (멀티 프로젝트 빌드 시)
// - 단일 프로젝트 빌드에서는 `include` 문이 필요 없습니다.
// - 여러 서브 프로젝트를 포함하는 멀티 프로젝트 빌드를 구성할 때 사용됩니다.
// - 예시: `include 'app', 'library'`
// -----------------------------------------------------------------------------
// 나쁜 예시: 멀티 프로젝트 빌드인데 `settings.gradle`에 `include` 문을 누락하는 것.
// - 서브 프로젝트가 빌드에 포함되지 않아 의존성 해결이나 태스크 실행 시 문제가 발생합니다.
// 좋은 예시: 멀티 프로젝트 빌드의 경우, 모든 서브 프로젝트를 명확하게 `include` 하여
// - Gradle이 프로젝트 구조를 정확하게 파악하고 빌드를 수행하도록 합니다.

// 이 예시는 단일 프로젝트이므로 `include` 문은 주석 처리합니다.
// include 'subproject-a'
// include 'subproject-b'

// -----------------------------------------------------------------------------
// Gradle Wrapper (개념 반복)
// - `gradlew` 스크립트 실행 시 `settings.gradle` 파일이 먼저 처리되어
//   현재 빌드에 어떤 프로젝트들이 포함될지 결정합니다.
// - `gradle-wrapper.properties` 파일은 `settings.gradle` 파일과 함께
//   Gradle Wrapper의 동작을 정의하는 중요한 파일입니다.
// -----------------------------------------------------------------------------

// 이 `settings.gradle` 파일은 `build.gradle`과 함께 사용됩니다.
// (자세한 내용은 README.md 참조)
