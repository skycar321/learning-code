// gradle/Step1_GradleBasics/build.gradle
// Gradle 기본 개념 및 시작 학습을 위한 build.gradle 파일 예시입니다.
// 이 파일은 간단한 Java 프로젝트의 Gradle 빌드 스크립트의 기본 구조와 요소를 보여줍니다.
//
// Gradle은 Groovy 또는 Kotlin DSL (Domain Specific Language)을 사용하여 빌드 스크립트를 작성합니다.
// 이 예시에서는 Groovy DSL을 사용합니다.

// -----------------------------------------------------------------------------
// 학습 포인트 1: `plugins` 블록
// - 프로젝트에 필요한 플러그인을 선언하는 곳입니다.
// - 플러그인은 Gradle의 기능을 확장하여 특정 언어(Java, Kotlin), 플랫폼(Android),
//   또는 빌드 도구(Maven Publish) 관련 태스크를 제공합니다.
// - `id 'java'`는 Java 개발에 필요한 기본 태스크(컴파일, 테스트, JAR 생성 등)를 추가합니다.
// -----------------------------------------------------------------------------
plugins {
    id 'java' // Java 프로젝트를 빌드하기 위한 기본 플러그인 적용
    // 나쁜 예시: 필요한 플러그인을 누락하거나, 너무 많은 불필요한 플러그인을 추가하는 것.
    // - 플러그인 누락 시 특정 빌드 태스크가 동작하지 않고, 과도한 플러그인 추가 시 빌드 시간이 길어질 수 있습니다.
}

// -----------------------------------------------------------------------------
// 학습 포인트 2: `group` 및 `version`
// - 빌드되는 아티팩트(JAR 파일 등)의 메타데이터를 정의합니다.
// - `group`: 프로젝트의 그룹 ID (예: com.mycompany.myproject)
// - `version`: 프로젝트의 버전 (예: 1.0.0-SNAPSHOT)
// -----------------------------------------------------------------------------
group 'com.example.gradle'
version '1.0-SNAPSHOT'

// -----------------------------------------------------------------------------
// 학습 포인트 3: `repositories` 블록
// - 프로젝트의 의존성(라이브러리)을 다운로드할 저장소를 선언하는 곳입니다.
// - Maven Central이 가장 일반적인 저장소이며, `mavenCentral()`로 간단히 설정합니다.
// - JCenter는 더 이상 활성화되지 않으므로 사용을 지양합니다.
// -----------------------------------------------------------------------------
repositories {
    mavenCentral() // Maven Central Repository에서 의존성을 찾도록 설정
    // 나쁜 예시: 필요한 의존성이 없는 저장소를 잘못 설정하거나, 프라이빗 저장소 설정을 누락하는 것.
    // - 의존성을 찾을 수 없어 빌드 실패로 이어집니다.
    // jcenter() // JCenter는 더 이상 권장되지 않습니다.
    // maven { url 'https://repo.spring.io/milestone' } // Spring Milestone Repository 예시
}

// -----------------------------------------------------------------------------
// 학습 포인트 4: `dependencies` 블록
// - 프로젝트가 실행되거나 테스트될 때 필요한 외부 라이브러리(의존성)를 선언하는 곳입니다.
// - `implementation`: 컴파일 및 런타임에 필요한 의존성. 주로 라이브러리 구현에 사용.
// - `testImplementation`: 테스트 코드 컴파일 및 실행에만 필요한 의존성.
// - `annotationProcessor`: 어노테이션 프로세서 의존성.
// -----------------------------------------------------------------------------
dependencies {
    // JUnit 5 (jupiter-api)를 테스트 스코프 의존성으로 추가
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    // JUnit 5 (jupiter-engine)를 테스트 런타임 의존성으로 추가 (테스트 실행 엔진)
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    // 나쁜 예시: 필요한 의존성을 누락하거나, 불필요한 의존성을 추가하여 빌드 크기를 늘리는 것.
    // - 누락 시 런타임 에러, 불필요한 추가 시 배포 번들 크기 증가 및 잠재적 충돌 발생.
    // implementation 'com.google.guava:guava:32.1-jre' // Guava 라이브러리 예시
}

// -----------------------------------------------------------------------------
// 학습 포인트 5: `test` 태스크 설정
// - `java` 플러그인이 제공하는 `test` 태스크를 커스터마이징합니다.
// - `useJUnitPlatform()`: JUnit 5를 사용하도록 설정합니다.
// -----------------------------------------------------------------------------
test {
    useJUnitPlatform() // JUnit 5 (JUnit Platform) 사용을 위한 설정
    // 테스트 실패 시에도 빌드를 계속 진행할지 여부
    // ignoreFailures = false
    // 테스트 결과 리포트 생성 여부
    // reports.html.required = true
    // reports.xml.required = true
    // 나쁜 예시: 테스트 설정을 누락하거나, 테스트 실패를 무시하도록 설정하는 것.
    // - 테스트는 품질 보증의 중요한 단계이므로, 항상 실행되고 실패 시 피드백을 주어야 합니다.
}

// -----------------------------------------------------------------------------
// 기타 설정 (옵션)
// - 자바 컴파일러 버전 설정
// -----------------------------------------------------------------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Java 17 사용
        // 나쁜 예시: 개발 환경의 Java 버전과 빌드 시 사용되는 Java 버전이 다른 것.
        // - 호환성 문제나 예상치 못한 빌드 오류를 유발할 수 있습니다.
    }
}

// -----------------------------------------------------------------------------
// Gradle Wrapper (개념)
// - `gradlew` 스크립트를 통해 Gradle을 실행하면, 프로젝트에 명시된 Gradle 버전을 자동으로 다운로드하여 사용합니다.
// - `gradle wrapper` 태스크를 실행하여 Wrapper 스크립트와 설정 파일(gradle-wrapper.properties)을 생성할 수 있습니다.
// - 이를 통해 프로젝트를 사용하는 모든 개발자가 동일한 Gradle 버전을 사용하여 일관된 빌드 환경을 유지할 수 있습니다.
// - `gradle wrapper --gradle-version 8.4` (예시: 8.4 버전의 Gradle Wrapper 생성)
// -----------------------------------------------------------------------------

// 이 `build.gradle` 파일을 사용하려면 다음 구조로 프로젝트를 생성해야 합니다.
// (자세한 내용은 README.md 참조)
/*
gradle/Step1_GradleBasics/
├── build.gradle
├── settings.gradle
└── src/
    └── main/
        └── java/
            └── com/
                └── example/
                    └── App.java
    └── test/
        └── java/
            └── com/
                └── example/
                    └── AppTest.java
*/