# kubernetes/Step3_StorageAndConfiguration.yaml
# Kubernetes 학습 계획 - 3단계: 스토리지 및 구성 관리
# 이 파일은 Kubernetes에서 애플리케이션의 영구 데이터 저장 (Volumes, PVC) 및
# 설정 관리 (ConfigMap, Secret)에 사용되는 리소스 객체들의 정의를 포함하는 YAML 예시입니다.
#
# Kubernetes 환경에서 실행되는 애플리케이션은 컨테이너의 일시적인(ephemeral) 특성으로 인해
# 데이터를 영구적으로 저장하기 위한 스토리지 솔루션이 필요하며,
# 환경 변수나 설정 파일 형태로 애플리케이션 설정을 관리할 수 있어야 합니다.

# -----------------------------------------------------------------------------
# 학습 포인트 1: PersistentVolumeClaim (PVC)
# - 사용자가 스토리지 자원(PersistentVolume, PV)을 '요청'하는 방법입니다.
# - 개발자는 PV의 세부 구현(어떤 스토리지 프로바이더를 사용할지)을 알 필요 없이 스토리지를 요청할 수 있습니다.
# - 클러스터 관리자는 PersistentVolume (PV)을 미리 프로비저닝하거나,
#   StorageClass를 통해 동적으로 프로비저닝되도록 설정할 수 있습니다.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim # 리소스 타입: PersistentVolumeClaim
metadata:
  name: my-app-pvc       # PVC의 고유한 이름
spec:
  accessModes:          # 요청하는 스토리지의 접근 모드 (PV와 일치해야 함)
    - ReadWriteOnce     # 하나의 노드에서 읽기-쓰기 가능 (가장 일반적)
    # - ReadOnlyMany      # 여러 노드에서 읽기만 가능
    # - ReadWriteMany     # 여러 노드에서 읽기-쓰기 가능 (NFS 등)
  resources:
    requests:           # 요청하는 스토리지의 용량
      storage: 1Gi      # 1 기비바이트 (GB) 스토리지 요청
  # storageClassName: manual # 특정 StorageClass를 지정하여 동적 프로비저닝 또는 특정 PV에 바인딩 (선택 사항)
  # 나쁜 예시: `resources.requests.storage`를 너무 작게 설정하여
  # - 애플리케이션 운영 중 디스크 공간 부족 문제를 야기하는 것.
  # - 또는 너무 크게 설정하여 불필요한 자원 낭비를 초래하는 것.
  # - 애플리케이션의 예상 데이터 사용량을 고려하여 적절한 크기를 설정해야 합니다.

---

# -----------------------------------------------------------------------------
# 학습 포인트 2: ConfigMap (컨피그맵)
# - Pod에 비민감(non-confidential) 설정 데이터(환경 변수, 설정 파일, 커맨드 라인 인자)를 주입하는 방법입니다.
# - key-value 쌍 형태로 데이터를 저장하며, 주로 애플리케이션의 설정값을 관리하는 데 사용됩니다.
# - Secret과 달리 데이터가 Base64로 인코딩되지 않고 평문으로 저장됩니다.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap # 리소스 타입: ConfigMap
metadata:
  name: my-app-config # ConfigMap의 고유한 이름
data:                # key-value 쌍 형태의 설정 데이터
  application.properties: | # 설정 파일 전체를 데이터로 저장 (예시)
    server.port=8080
    spring.datasource.url=jdbc:postgresql://mydb:5432/myappdb
    spring.datasource.username=user
    spring.datasource.password=${DB_PASSWORD} # 비밀번호는 Secret으로 관리하는 것이 좋습니다.
  app.logging.level: INFO  # 환경 변수로 주입할 설정값
  app.feature.enabled: "true"
  # 나쁜 예시: 데이터베이스 비밀번호, API 키 등 민감한 정보를 ConfigMap에 저장하는 것.
  # - ConfigMap의 데이터는 클러스터 내에서 쉽게 접근할 수 있으므로 보안에 취약합니다.
  # - 민감한 정보는 반드시 Secret을 사용해야 합니다.

---

# -----------------------------------------------------------------------------
# 학습 포인트 3: Secret (시크릿)
# - Pod에 민감한 설정 데이터(비밀번호, 토큰, 키 등)를 안전하게 주입하는 방법입니다.
# - 데이터는 Base64로 인코딩되어 저장되지만, 이는 암호화가 아니며 단순히 가독성을 낮추는 목적입니다.
#   실제 암호화는 KMS(Key Management System)와 연동하는 추가적인 보안 조치가 필요합니다.
# - `Opaque` 타입이 가장 일반적이며, Generic Secret이라고도 합니다.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret # 리소스 타입: Secret
metadata:
  name: my-app-secret # Secret의 고유한 이름
type: Opaque         # 시크릿 타입 (Opaque, kubernetes.io/dockerconfigjson, kubernetes.io/tls 등)
data:                # key-value 쌍 형태의 민감 데이터 (값은 Base64 인코딩되어야 함)
  db_password: "c2VjdXJlUGFzc3dvcmQxMjM=" # "securePassword123"을 Base64 인코딩한 값
  api_key: "QUJDMTIzNEZHSDU2Nzg="        # "ABC1234FGHS5678"을 Base64 인코딩한 값
  # 나쁜 예시: Base64 인코딩을 암호화로 착각하여 Secret에 중요한 키를 평문처럼 저장하는 것.
  # - Secret의 Base64 인코딩은 단순히 데이터를 숨기는 것이지 암호화하는 것이 아닙니다.
  # - 더 높은 보안이 요구되는 경우, 외부 KMS 솔루션을 연동하거나 Sealed Secrets와 같은 도구를 사용해야 합니다.

---

